<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNJ Shop - JNJ Website</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="animated-background.css">
    <link rel="stylesheet" href="background-music.css">
    <script src="animated-background.js" defer></script>
    <script src="page-transitions.js" defer></script>
    <script src="background-music.js" defer></script>
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="auth.js" defer></script>
    <style>
        .shop-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .shop-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .shop-title {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .shop-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .shop-item.limited-edition {
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .shop-item.limited-edition::before {
            content: '⭐ LIMITED EDITION ⭐';
            position: absolute;
            top: 10px;
            right: -30px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            padding: 5px 40px;
            font-size: 12px;
            font-weight: bold;
            transform: rotate(45deg);
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        .shop-item::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: rotate 15s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .shop-item:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .shop-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        .shop-name {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .shop-description {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .shop-price-container {
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }

        .shop-price {
            font-size: 32px;
            font-weight: bold;
            color: #22c55e;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .shop-price-original {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: line-through;
            margin-right: 10px;
        }

        .shop-discount-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-left: 10px;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .shop-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 20px;
        }

        .shop-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }

        .shop-button:active {
            transform: scale(0.98);
        }

        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: bold;
            font-size: 16px;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-8px);
        }

        /* Dev purchases section */
        .dev-purchases {
            margin-top: 60px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: none;
        }

        .dev-purchases.visible {
            display: block;
        }

        .dev-purchases h2 {
            color: #FFD700;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .purchases-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .purchase-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .purchase-info {
            flex: 1;
            min-width: 200px;
        }

        .purchase-info strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .purchase-info span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            display: block;
            margin: 3px 0;
        }

        .grant-button {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .grant-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .grant-button:disabled {
            background: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .no-purchases {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 40px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: none;
            align-items: center;
            gap: 15px;
            min-width: 300px;
            max-width: 500px;
            border: 2px solid rgba(102, 126, 234, 0.5);
            backdrop-filter: blur(10px);
            animation: slideIn 0.3s ease-out;
        }

        .notification.show {
            display: flex;
        }

        .notification.success {
            border-color: rgba(34, 197, 94, 0.5);
        }

        .notification.error {
            border-color: rgba(239, 68, 68, 0.5);
        }

        .notification-icon {
            font-size: 32px;
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .notification-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .shop-item.purchased {
            opacity: 0.7;
            border-color: rgba(34, 197, 94, 0.5);
        }

        .purchased-badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.3);
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            border: 1px solid rgba(34, 197, 94, 0.5);
        }

        .shop-button:disabled,
        .shop-button.purchased {
            background: rgba(34, 197, 94, 0.3);
            color: #22c55e;
            cursor: not-allowed;
            border: 2px solid rgba(34, 197, 94, 0.5);
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="shop-container">
            <div class="shop-header">
                <h1 class="shop-title">🛍️ JNJ Shop 🛍️</h1>
                <p class="shop-subtitle">Exclusive limited edition items and merchandise!</p>
            </div>

            <div class="shop-grid" id="shopGrid">
                <!-- Items will be dynamically added here -->
                    </div>

            <!-- Dev purchases section -->
            <div class="dev-purchases" id="devPurchases">
                <h2>⭐ Dev Purchase Management</h2>
                <div id="purchasesList" class="purchases-list">
                    <div class="no-purchases">Loading purchases...</div>
                </div>
            </div>

            <div style="text-align: center;">
                <a href="index.html" class="back-button">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <span class="notification-icon" id="notificationIcon">✅</span>
        <div class="notification-content">
            <div class="notification-title" id="notificationTitle">Success</div>
            <div class="notification-message" id="notificationMessage"></div>
        </div>
    </div>

    <script>
        const PROFILE_STORAGE_KEY = 'jnjUserProfile';
        
        // Shop items configuration
        const SHOP_ITEMS = [
            {
                id: 'cd',
                name: 'Song CD',
                icon: '💿',
                description: 'Physical CD containing all original JNJ compositions. High-quality audio with exclusive artwork and liner notes.',
                price: '5.00',
                originalPrice: '7.00',
                type: 'item',
                grantType: 'item',
                grantValue: 'cd',
                url: 'cd-order.html',
                limitedEdition: false
            },
            {
                id: 'legendary-title',
                name: 'Legendary Title',
                icon: '⚡',
                description: 'Become legendary! Get an exclusive Legendary title that shows your elite status.',
                price: '1.50',
                type: 'title',
                grantType: 'title',
                grantValue: 'legendary',
                limitedEdition: true
            },
            {
                id: 'vip-pass',
                name: 'VIP Pass',
                icon: '👑',
                description: 'Become a VIP member! Get an exclusive VIP title that shows your special status.',
                price: '15.00',
                type: 'title',
                grantType: 'title',
                grantValue: 'vip',
                limitedEdition: true
            },
            {
                id: 'fire-emoji',
                name: 'Fire Emoji',
                icon: '🔥',
                description: 'Unlock a fire profile emoji to customize your avatar!',
                price: '0.50',
                type: 'profile-image',
                grantType: 'profile-image',
                grantValue: 'fire-emoji'
            }
        ];

        // Initialize Firebase
        let db = null;
        function initFirebase() {
            try {
                if (typeof firebase === 'undefined' || !firebaseConfig) {
                    console.warn('Firebase not available');
                    return false;
                }
                
                if (!firebase.apps || firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                
                db = firebase.firestore();
                return true;
            } catch (error) {
                console.error('Firebase initialization error:', error);
                return false;
            }
        }

        // Check if user is dev
        function isDev() {
            try {
                const profileData = localStorage.getItem(PROFILE_STORAGE_KEY);
                if (profileData) {
                    const profile = JSON.parse(profileData);
                    return profile.isDev === true;
                }
            } catch (e) {
                console.error('Error checking dev status:', e);
            }
            return false;
        }

        // Check if user has purchased an item
        async function hasPurchasedItem(itemId) {
            try {
                if (!db) {
                    initFirebase();
                }
                
                if (!db) return false;

                // Get current user ID
                let userId = null;
                if (window.authSystem && window.authSystem.isAuthenticated()) {
                    const user = window.authSystem.getUser();
                    if (user && user.uid) {
                        userId = user.uid;
                    }
                }

                if (!userId) return false;

                // Check if user has purchased this item
                const purchasesSnapshot = await db.collection('purchases')
                    .where('userId', '==', userId)
                    .where('itemId', '==', itemId)
                    .get();

                return !purchasesSnapshot.empty;
            } catch (error) {
                console.error('Error checking purchase status:', error);
                return false;
            }
        }

        // Render shop items
        async function renderShopItems() {
            const shopGrid = document.getElementById('shopGrid');
            if (!shopGrid) return;

            shopGrid.innerHTML = '';

            for (const item of SHOP_ITEMS) {
                const itemDiv = document.createElement('div');
                const isPurchased = await hasPurchasedItem(item.id);
                itemDiv.className = `shop-item ${item.limitedEdition ? 'limited-edition' : ''} ${isPurchased ? 'purchased' : ''}`;
                
                let buttonHTML = '';
                if (isPurchased) {
                    buttonHTML = `<button class="shop-button purchased" disabled>✓ Purchased</button>`;
                } else if (item.url) {
                    buttonHTML = `<a href="${item.url}" class="shop-button" style="text-decoration: none; display: block; text-align: center;">Purchase ${item.name}</a>`;
                } else {
                    buttonHTML = `<button class="shop-button" onclick="purchaseItem('${item.id}')">Purchase ${item.name}</button>`;
                }

                const hasDiscount = item.originalPrice && parseFloat(item.originalPrice) > parseFloat(item.price);
                const discountAmount = hasDiscount ? (parseFloat(item.originalPrice) - parseFloat(item.price)).toFixed(2) : null;

                itemDiv.innerHTML = `
                    <span class="shop-icon">${item.icon}</span>
                    <h2 class="shop-name">${item.name}</h2>
                    <p class="shop-description">${item.description}</p>
                    <div class="shop-price-container">
                        ${hasDiscount ? `<span class="shop-price-original">$${item.originalPrice}</span>` : ''}
                        <span class="shop-price">$${item.price}</span>
                        ${hasDiscount ? `<span class="shop-discount-badge">Save $${discountAmount}!</span>` : ''}
                    </div>
                    ${buttonHTML}
                    ${isPurchased ? '<div class="purchased-badge">✓ Already Purchased</div>' : ''}
                `;

                shopGrid.appendChild(itemDiv);
            }
        }

        // Show notification
        function showNotification(type, title, message) {
            const notification = document.getElementById('notification');
            const notificationIcon = document.getElementById('notificationIcon');
            const notificationTitle = document.getElementById('notificationTitle');
            const notificationMessage = document.getElementById('notificationMessage');

            if (!notification) return;

            // Set icon based on type
            if (type === 'success') {
                notificationIcon.textContent = '✅';
                notification.className = 'notification success show';
            } else if (type === 'error') {
                notificationIcon.textContent = '❌';
                notification.className = 'notification error show';
            } else {
                notificationIcon.textContent = 'ℹ️';
                notification.className = 'notification show';
            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            // Auto-hide after 5 seconds
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        // Purchase item
        async function purchaseItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) {
                showNotification('error', '❌ Error', 'Item not found!');
                return;
            }

            // Get user info
            let customerEmail = 'Not provided';
            let userId = null;
            let username = 'Not provided';
            try {
                if (window.authSystem && window.authSystem.isAuthenticated()) {
                    const user = window.authSystem.getUser();
                    if (user) {
                        if (user.email) customerEmail = user.email;
                        if (user.uid) userId = user.uid;
                    }
                    
                    // Get username from profile
                    const profileData = localStorage.getItem(PROFILE_STORAGE_KEY);
                    if (profileData) {
                        try {
                            const profile = JSON.parse(profileData);
                            if (profile.username && profile.username.trim() !== '') {
                                username = profile.username.trim();
                            } else if (profile.displayName && profile.displayName.trim() !== '') {
                                username = profile.displayName.trim();
                            }
                        } catch (e) {
                            console.warn('Error parsing profile:', e);
                        }
                    }
                }
            } catch (error) {
                console.warn('Could not get user info:', error);
            }

            // Check if already purchased
            const alreadyPurchased = await hasPurchasedItem(itemId);
            if (alreadyPurchased) {
                showNotification('error', '❌ Already Purchased', 'You have already purchased this item!');
                renderShopItems(); // Refresh to show purchased status
                return;
            }

            // Show confirmation
            const confirmed = confirm(
                `Confirm Purchase\n\n` +
                `Item: ${item.name}\n` +
                `Price: $${item.price}\n\n` +
                `Click OK to confirm your purchase.`
            );

            if (!confirmed) return;

            // Show loading
                const loadingMsg = document.createElement('div');
                loadingMsg.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0, 0, 0, 0.9);
                    color: white;
                    padding: 30px;
                    border-radius: 10px;
                    z-index: 10000;
                    text-align: center;
                    font-size: 18px;
                `;
                loadingMsg.textContent = 'Processing purchase...';
                document.body.appendChild(loadingMsg);

                try {
                // Initialize Firebase if needed
                if (!db) {
                    initFirebase();
                }

                if (!db) {
                    throw new Error('Firebase not available');
                }

                // Save purchase to Firestore
                const purchaseData = {
                    itemId: item.id,
                    itemName: item.name,
                    itemType: item.type,
                    price: item.price,
                    grantType: item.grantType,
                    grantValue: item.grantValue,
                    customerEmail: customerEmail,
                    userId: userId,
                    username: username,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'pending',
                    granted: false
                };

                await db.collection('purchases').add(purchaseData);
                console.log('Purchase saved to Firestore');

                // Remove loading
                    document.body.removeChild(loadingMsg);

                showNotification(
                    'success',
                    '✅ Purchase Confirmed!',
                    `Thank you for purchasing ${item.name} for $${item.price}.\n\n💰 Please bring the money ($${item.price}) to one of the developers.\n\nYour purchase has been recorded. A developer will grant your item once payment is received!`
                );

                // Refresh shop items to show purchased status
                renderShopItems();

                // Refresh purchases if dev
                if (isDev()) {
                    loadPurchases();
                }
            } catch (error) {
                console.error('Purchase error:', error);
                if (document.body.contains(loadingMsg)) {
                    document.body.removeChild(loadingMsg);
                }
                showNotification(
                    'error',
                    '❌ Purchase Error',
                    'Error processing purchase. Please try again.'
                );
            }
        }

        // Load purchases for dev view
        async function loadPurchases() {
            const devPurchases = document.getElementById('devPurchases');
            const purchasesList = document.getElementById('purchasesList');
            
            if (!isDev()) {
                if (devPurchases) devPurchases.classList.remove('visible');
                return;
            }

            if (!devPurchases || !purchasesList) return;

            devPurchases.classList.add('visible');
            purchasesList.innerHTML = '<div class="no-purchases">Loading purchases...</div>';

            try {
                if (!db) {
                    initFirebase();
                }

                if (!db) {
                    purchasesList.innerHTML = '<div class="no-purchases">Firebase not available</div>';
                    return;
                }

                // Get all purchases, ordered by timestamp
                const purchasesSnapshot = await db.collection('purchases')
                    .orderBy('timestamp', 'desc')
                    .get();

                if (purchasesSnapshot.empty) {
                    purchasesList.innerHTML = '<div class="no-purchases">No purchases yet</div>';
                    return;
                }

                purchasesList.innerHTML = '';

                purchasesSnapshot.forEach(doc => {
                    const purchase = doc.data();
                    const purchaseId = doc.id;
                    
                    // Format timestamp
                    let timestampStr = 'Unknown';
                    if (purchase.timestamp) {
                        if (purchase.timestamp.toDate) {
                            timestampStr = purchase.timestamp.toDate().toLocaleString();
                        } else if (purchase.timestamp.seconds) {
                            timestampStr = new Date(purchase.timestamp.seconds * 1000).toLocaleString();
                        }
                    }

                    const purchaseDiv = document.createElement('div');
                    purchaseDiv.className = 'purchase-item';
                    purchaseDiv.innerHTML = `
                        <div class="purchase-info">
                            <strong>${purchase.itemName || 'Unknown Item'}</strong>
                            <span>Price: $${purchase.price || '0.00'}</span>
                            <span>Username: ${purchase.username || 'Not provided'}</span>
                            <span>Email: ${purchase.customerEmail || 'Not provided'}</span>
                            <span>User ID: ${purchase.userId || 'N/A'}</span>
                            <span>Date: ${timestampStr}</span>
                            <span>Status: ${purchase.granted ? '✅ Granted' : '⏳ Pending'}</span>
                            <span>Grant: ${purchase.grantType === 'title' ? 'Title: ' + purchase.grantValue : purchase.grantValue}</span>
                        </div>
                        <button class="grant-button" 
                                onclick="grantItem('${purchaseId}', '${purchase.userId || ''}', '${purchase.grantType}', '${purchase.grantValue}')"
                                ${purchase.granted ? 'disabled' : ''}>
                            ${purchase.granted ? 'Already Granted' : 'Grant Item'}
                        </button>
                    `;

                    purchasesList.appendChild(purchaseDiv);
                });
            } catch (error) {
                console.error('Error loading purchases:', error);
                purchasesList.innerHTML = '<div class="no-purchases">Error loading purchases</div>';
            }
        }

        // Grant item to user
        async function grantItem(purchaseId, userId, grantType, grantValue) {
            const itemType = grantType === 'title' ? 'title' : grantType === 'profile-image' ? 'profile image' : 'item';
            if (!confirm(`Grant ${itemType}: ${grantValue} to user ${userId || 'N/A'}?`)) {
                return;
            }

            try {
                if (!db) {
                    initFirebase();
                }

                if (!db) {
                    showNotification('error', '❌ Error', 'Firebase not available');
                    return;
                }

                // Update purchase status
                await db.collection('purchases').doc(purchaseId).update({
                    granted: true,
                    grantedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Grant the item to the user
                if (userId) {
                    // Get user's profile from Firestore
                    const userDoc = await db.collection('users').doc(userId).get();
                    let userData = {};
                    let profile = {};
                    
                    if (userDoc.exists) {
                        userData = userDoc.data();
                        // Preserve all existing profile fields
                        profile = { ...(userData.profile || {}) };
                    }

                    if (grantType === 'title') {
                        const unlockedTitles = profile.unlockedTitles || [];

                        // Add title if not already unlocked
                        if (!unlockedTitles.includes(grantValue)) {
                            unlockedTitles.push(grantValue);
                            profile.unlockedTitles = unlockedTitles;
                            console.log('Added title to unlockedTitles:', grantValue, 'Full array:', unlockedTitles);
                        } else {
                            console.log('Title already unlocked:', grantValue);
                        }
                    } else if (grantType === 'profile-image') {
                        const unlockedImages = profile.unlockedImages || [];

                        // Add profile image if not already unlocked
                        if (!unlockedImages.includes(grantValue)) {
                            unlockedImages.push(grantValue);
                            profile.unlockedImages = unlockedImages;
                            console.log('Added profile image to unlockedImages:', grantValue, 'Full array:', unlockedImages);
                        } else {
                            console.log('Profile image already unlocked:', grantValue);
                        }
                    }

                    // Update user profile in Firestore - preserve all existing fields
                    if (userDoc.exists) {
                        // Use update to preserve other fields in the document
                        await db.collection('users').doc(userId).update({
                            profile: profile
                        });
                        console.log('Updated user profile in Firestore with profile:', JSON.stringify(profile));
                    } else {
                        // User document doesn't exist, create it
                        await db.collection('users').doc(userId).set({
                            profile: profile,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        console.log('Created new user document in Firestore');
                    }

                    // Force reload user data to ensure titles are visible
                    // Also update localStorage if this is the current user and sync to Firestore
                    if (window.authSystem && window.authSystem.isAuthenticated()) {
                        const currentUser = window.authSystem.getUser();
                        if (currentUser && currentUser.uid === userId) {
                            // Reload user data from Firestore to get the latest profile
                            try {
                                await window.authSystem.loadUserData(userId);
                                console.log('Reloaded user data from Firestore');
                            } catch (e) {
                                console.error('Error reloading user data:', e);
                            }
                            
                            const localProfile = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || '{}');
                            // Merge with the updated profile from Firestore
                            if (grantType === 'title') {
                                localProfile.unlockedTitles = profile.unlockedTitles || [];
                                console.log('Updated localStorage unlockedTitles:', localProfile.unlockedTitles);
                            } else if (grantType === 'profile-image') {
                                localProfile.unlockedImages = profile.unlockedImages || [];
                                console.log('Updated localStorage unlockedImages:', localProfile.unlockedImages);
                            }
                            localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(localProfile));
                            
                            // Also save to Firestore via authSystem to ensure sync
                            try {
                                await window.authSystem.saveUserData({ profile: localProfile });
                                console.log('Synced profile to Firestore via authSystem');
                            } catch (e) {
                                console.error('Error syncing profile:', e);
                            }
                        }
                    }
                } else {
                    console.warn('No userId provided, cannot grant item');
                }

                showNotification('success', '✅ Item Granted', 'Item granted successfully!');
                loadPurchases(); // Refresh the list
                } catch (error) {
                console.error('Error granting item:', error);
                showNotification('error', '❌ Error', 'Error granting item. Please try again.');
            }
        }

        // Initialize page
        function initPage() {
            renderShopItems();
            
            // Wait for auth system to be ready, then check dev status
            function checkDevStatus() {
                if (window.authSystem) {
                    if (isDev()) {
                        loadPurchases();
                    }
                } else {
                    setTimeout(checkDevStatus, 100);
                }
            }
            
            // Also check when auth state changes
            window.addEventListener('authStateChanged', () => {
                setTimeout(() => {
                    if (isDev()) {
                        loadPurchases();
                    }
                }, 500);
            });
            
            checkDevStatus();
        }

        // Initialize Firebase and page when ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initFirebase();
                initPage();
            });
        } else {
            initFirebase();
            initPage();
        }
    </script>
</body>
</html>
