<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNJ Shop - JNJ Website</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/animated-background.css">
    <link rel="stylesheet" href="css/background-music.css">
    <script src="js/animated-background.js" defer></script>
    <script src="js/page-transitions.js" defer></script>
    <script src="js/background-music.js" defer></script>
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/auth.js" defer></script>
    <script src="js/quest-tracker.js" defer></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-color: #22c55e;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --hover-glow: rgba(102, 126, 234, 0.3);
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .shop-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .shop-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .shop-title {
            font-size: 56px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
            animation: float 6s ease-in-out infinite;
            position: relative;
        }

        .shop-title::after {
            content: '✨';
            position: absolute;
            top: -10px;
            right: -40px;
            font-size: 30px;
            animation: sparkle 2s ease-in-out infinite;
        }

        .shop-subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .coins-display {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 50px;
            padding: 12px 24px;
            margin-top: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        .coins-icon {
            font-size: 24px;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
        }

        .coins-amount {
            font-size: 24px;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            min-width: 40px;
            text-align: center;
        }

        .coins-label {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Search and Filter Bar */
        .shop-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* Scroll animations */
        .shop-item {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .shop-item:nth-child(1) { animation-delay: 0.1s; }
        .shop-item:nth-child(2) { animation-delay: 0.2s; }
        .shop-item:nth-child(3) { animation-delay: 0.3s; }
        .shop-item:nth-child(4) { animation-delay: 0.4s; }
        .shop-item:nth-child(5) { animation-delay: 0.5s; }
        .shop-item:nth-child(6) { animation-delay: 0.6s; }
        .shop-item:nth-child(n+7) { animation-delay: 0.7s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Enhanced card glow */
        .shop-item.limited-edition::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--gold-gradient);
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
            filter: blur(10px);
        }

        .shop-item.limited-edition:hover::after {
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .shop-controls {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .category-filters {
                width: 100%;
                justify-content: center;
            }

            .sort-controls {
                width: 100%;
                justify-content: center;
            }

            .results-count {
                width: 100%;
                text-align: center;
                margin-left: 0;
            }

            .shop-grid {
                grid-template-columns: 1fr;
            }

            .shop-title {
                font-size: 36px;
            }

            .shop-title::after {
                right: -30px;
                font-size: 24px;
            }

            .modal {
                padding: 25px;
                margin: 10px;
            }

            .item-details-icon {
                font-size: 80px;
            }

            .item-details-name {
                font-size: 24px;
            }

            .featured-banner {
                padding: 20px;
            }

            .featured-icon {
                font-size: 60px;
            }

            .featured-title {
                font-size: 24px;
            }
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 0 0 20px var(--hover-glow);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            pointer-events: none;
        }

        .category-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 25px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .category-btn:hover {
            border-color: rgba(102, 126, 234, 0.6);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .results-count {
            color: var(--text-secondary);
            font-size: 14px;
            margin-left: auto;
            padding: 10px 0;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
        }

        .sort-select {
            padding: 10px 15px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .sort-select:hover {
            border-color: rgba(102, 126, 234, 0.6);
        }

        .sort-select:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 0 15px var(--hover-glow);
        }

        /* Featured Banner */
        .featured-banner {
            background: var(--primary-gradient);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }

        .featured-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        .featured-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .featured-icon {
            font-size: 80px;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
            animation: float 4s ease-in-out infinite;
        }

        .featured-text {
            flex: 1;
            min-width: 250px;
        }

        .featured-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .featured-description {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, var(--card-bg) 25%, rgba(255, 255, 255, 0.1) 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 20px;
        }

        .skeleton-item {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            min-height: 450px;
        }

        .skeleton-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto 20px;
        }

        .skeleton-title {
            width: 70%;
            height: 28px;
            border-radius: 8px;
            margin: 0 auto 15px;
        }

        .skeleton-description {
            width: 90%;
            height: 16px;
            border-radius: 8px;
            margin: 0 auto 10px;
        }

        .skeleton-description:nth-child(4) {
            width: 75%;
        }

        .skeleton-price {
            width: 100px;
            height: 32px;
            border-radius: 8px;
            margin: 20px auto;
        }

        .skeleton-button {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            margin-top: 20px;
        }

        /* Wishlist Button */
        .wishlist-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .wishlist-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: var(--error-color);
            transform: scale(1.1);
        }

        .wishlist-btn.active {
            background: var(--error-color);
            border-color: var(--error-color);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .wishlist-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99999;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--success-color);
            animation: confetti-fall 3s linear forwards;
        }

        /* Purchase Success Animation */
        .purchase-success {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 100001;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.95) 0%, rgba(16, 163, 74, 0.95) 100%);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .purchase-success.show {
            animation: purchaseSuccessPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes purchaseSuccessPop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-180deg);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1) rotate(10deg);
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .purchase-success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 1s ease-in-out infinite;
        }

        .purchase-success-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .purchase-success-message {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.6;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .shop-grid.empty {
            grid-template-columns: 1fr;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-results-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-results h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .shop-item {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            min-height: 450px;
        }

        .shop-item:hover {
            transform: translateY(-8px) scale(1.02) rotateY(2deg);
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 0 15px 40px var(--hover-glow);
        }

        .shop-item.limited-edition:hover {
            box-shadow: 0 15px 50px rgba(255, 215, 0, 0.5);
            transform: translateY(-10px) scale(1.03) rotateY(3deg);
        }

        .shop-item.limited-edition {
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .shop-item.limited-edition::before {
            content: '⭐ LIMITED EDITION ⭐';
            position: absolute;
            top: 10px;
            right: -30px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            padding: 5px 40px;
            font-size: 12px;
            font-weight: bold;
            transform: rotate(45deg);
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        .shop-item::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: rotate 15s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .shop-item:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .shop-icon {
            font-size: 90px;
            margin-bottom: 20px;
            display: block;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s ease;
        }

        .shop-icon img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .shop-item:hover .shop-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .shop-item:hover .shop-icon img {
            transform: scale(1.1) rotate(5deg);
        }

        .shop-name {
            font-size: 26px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .shop-description {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.7;
            position: relative;
            z-index: 1;
            flex-grow: 1;
        }

        .shop-price-container {
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }

        .shop-price {
            font-size: 32px;
            font-weight: bold;
            color: #22c55e;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .shop-price-original {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: line-through;
            margin-right: 10px;
        }

        .coins-granted {
            font-size: 18px;
            color: #FFD700;
            font-weight: 600;
            margin-left: 8px;
        }

        .shop-discount-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-left: 10px;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .shop-button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: auto;
            overflow: hidden;
        }

        .shop-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .shop-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .shop-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .shop-button:active {
            transform: translateY(0);
        }

        .shop-button span {
            position: relative;
            z-index: 1;
        }

        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: bold;
            font-size: 16px;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-8px);
        }

        /* Dev purchases section */
        .dev-purchases {
            margin-top: 60px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: none;
        }

        .dev-purchases.visible {
            display: block;
        }

        .dev-purchases h2 {
            color: #FFD700;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .purchases-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .purchase-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .purchase-info {
            flex: 1;
            min-width: 200px;
        }

        .purchase-info strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .purchase-info span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            display: block;
            margin: 3px 0;
        }

        .grant-button {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .grant-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .grant-button:disabled {
            background: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;

        // Initialize Firebase
        let db = null;
        function initFirebase() {
            try {
                if (typeof firebase === 'undefined' || !firebaseConfig) {
                    console.warn('Firebase not available');
                    return false;
                }
                
                if (!firebase.apps || firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                
                db = firebase.firestore();
                return true;
            } catch (error) {
                console.error('Firebase initialization error:', error);
                return false;
            }
        }

        // Check if user is dev
        function isDev() {
            try {
                const profileData = localStorage.getItem(PROFILE_STORAGE_KEY);
                if (profileData) {
                    const profile = JSON.parse(profileData);
                    return profile.isDev === true;
                }
            } catch (e) {
                console.error('Error checking dev status:', e);
            }
            return false;
        }

        // Check if user has purchased an item
        async function hasPurchasedItem(itemId) {
            try {
                // First check user's profile (faster, no Firebase read needed if profile is loaded)
                if (window.authSystem && window.authSystem.isAuthenticated()) {
                    const user = window.authSystem.getUser();
                    if (user && user.uid) {
                        // Check localStorage first (fastest)
                        const profileData = localStorage.getItem(PROFILE_STORAGE_KEY);
                        if (profileData) {
                            try {
                                const profile = JSON.parse(profileData);
                                const purchasedItems = profile.purchasedItems || [];
                                if (purchasedItems.includes(itemId)) {
                                    return true;
                                }
                            } catch (e) {
                                console.warn('Error parsing profile from localStorage:', e);
                            }
                        }
                        
                        // If not in localStorage, check Firestore user profile
                        if (!db) {
                            initFirebase();
                        }
                        
                        if (db) {
                            try {
                                const userDoc = await db.collection('users').doc(user.uid).get();
                                if (userDoc.exists) {
                                    const userData = userDoc.data();
                                    const profile = userData.profile || {};
                                    const purchasedItems = profile.purchasedItems || [];
                                    if (purchasedItems.includes(itemId)) {
                                        return true;
                                    }
                                }
                            } catch (e) {
                                console.warn('Error checking Firestore profile:', e);
                            }
                        }
                    }
                }

                // Fallback: Check purchases collection (for backwards compatibility)
                if (!db) {
                    initFirebase();
                }
                
                if (!db) return false;

                // Get current user ID
                let userId = null;
                if (window.authSystem && window.authSystem.isAuthenticated()) {
                    const user = window.authSystem.getUser();
                    if (user && user.uid) {
                        userId = user.uid;
                    }
                }

                if (!userId) return false;

                // Check if user has purchased this item in purchases collection
                const purchasesSnapshot = await db.collection('purchases')
                    .where('userId', '==', userId)
                    .where('itemId', '==', itemId)
                    .limit(1)
                    .get();

                return !purchasesSnapshot.empty;
            } catch (error) {
                console.error('Error checking purchase status:', error);
                return false;
            }
        }

        // Coin management
        const COINS_STORAGE_KEY = 'jnjCoins';
        
        // Load coins from localStorage
        function loadCoins() {
            try {
                const coins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                updateCoinsDisplay(coins);
                return coins;
            } catch (e) {
                console.error('Error loading coins:', e);
                return 0;
            }
        }
        
        // Save coins to localStorage
        function saveCoins(coins) {
            try {
                localStorage.setItem(COINS_STORAGE_KEY, coins.toString());
                updateCoinsDisplay(coins);
            } catch (e) {
                console.error('Error saving coins:', e);
            }
        }
        
        // Save coins to Firebase
        async function saveCoinsToFirebase(coins) {
            try {
                if (!window.authSystem || !window.authSystem.isAuthenticated()) {
                    return;
                }
                
                const user = window.authSystem.getUser();
                if (!user || !user.uid) {
                    return;
                }
                
                if (!db) {
                    initFirebase();
                }
                
                if (!db) {
                    return;
                }
                
                // Update user profile with coins
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.exists ? userDoc.data() : {};
                const profile = { ...(userData.profile || {}) };
                profile.coins = coins;
                
                if (userDoc.exists) {
                    await db.collection('users').doc(user.uid).update({
                        profile: profile
                    });
                } else {
                    await db.collection('users').doc(user.uid).set({
                        profile: profile,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                // Also sync via authSystem
                try {
                    await window.authSystem.saveUserData({ profile: profile });
                } catch (e) {
                    console.error('Error syncing coins via authSystem:', e);
                }
                
                console.log(`Coins saved to Firebase: ${coins}`);
            } catch (e) {
                console.error('Error saving coins to Firebase:', e);
            }
        }

            try {
                if (!window.authSystem || !window.authSystem.isAuthenticated()) {
                    // Fallback to localStorage if not authenticated
                    const localCoins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                    updateCoinsDisplay(localCoins);
                    return;
                }
                
                const user = window.authSystem.getUser();
                if (!user || !user.uid) {
                    return;
                }
                
                if (!db) {
                    initFirebase();
                }
                
                if (!db) {
                    // Fallback to localStorage if Firebase not available
                    const localCoins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                    updateCoinsDisplay(localCoins);
                    return;
                }
                
                // Single read from user profile
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    const profile = userData.profile || {};
                    const firebaseCoins = profile.coins || 0;
                    const localCoins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                    
                    // Use the higher value (in case local was updated while offline)
                    const coins = Math.max(firebaseCoins, localCoins);
                    
                    // Save to both localStorage and update display
                    localStorage.setItem(COINS_STORAGE_KEY, coins.toString());
                    saveCoins(coins);
                    
                    // If coins differ from Firebase, save the synced value
                    if (coins !== firebaseCoins) {
                        await saveCoinsToFirebase(coins);
                    }
                } else {
                    // No profile yet, use localStorage value or default to 0
                    const localCoins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                    localStorage.setItem(COINS_STORAGE_KEY, localCoins.toString());
                    saveCoins(localCoins);
                    
                    // Save to Firebase if we have coins
                    if (localCoins > 0) {
                        await saveCoinsToFirebase(localCoins);
                    }
                }
            } catch (e) {
                console.error('Error loading coins from Firebase:', e);
                // Fallback to localStorage on error
                const localCoins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                updateCoinsDisplay(localCoins);
            }
        }
        
        // Update coins display
        function updateCoinsDisplay(coins) {
            const coinsAmount = document.getElementById('coinsAmount');
            if (coinsAmount) {
                coinsAmount.textContent = coins.toLocaleString();
            }

        // Add coins (for coin purchases)
        async function addCoins(amount) {
            const currentCoins = loadCoins();
            const newCoins = currentCoins + amount;
            saveCoins(newCoins);
            await saveCoinsToFirebase(newCoins);
        }
        
        // Deduct coins (for purchases)
        async function deductCoins(amount) {
            const currentCoins = loadCoins();
            if (currentCoins < amount) {
                return false; // Not enough coins
            }
            const newCoins = currentCoins - amount;
            saveCoins(newCoins);
            await saveCoinsToFirebase(newCoins);
            return true;

        // Filter and search state
        let currentCategory = 'all';
        let searchQuery = '';
        let sortBy = 'default';
        let filteredItems = [...SHOP_ITEMS];
        let wishlist = JSON.parse(localStorage.getItem('jnjWishlist') || '[]');

        // Initialize filters
        function initFilters() {
            const categoryButtons = document.querySelectorAll('.category-btn');
            categoryButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                    filterItems();
                });
            });

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value.toLowerCase().trim();
                    filterItems();
                });
            }

            const sortSelect = document.getElementById('sortSelect');
            if (sortSelect) {
                sortSelect.addEventListener('change', (e) => {
                    sortBy = e.target.value;
                    filterItems();
                });
            }
        }

        // Sort items
        function sortItems(items) {
            const sorted = [...items];
            switch(sortBy) {
                case 'price-low':
                    return sorted.sort((a, b) => {
                        const priceA = a.type === 'coins' ? parseFloat(a.price) : (a.priceInCoins || 0);
                        const priceB = b.type === 'coins' ? parseFloat(b.price) : (b.priceInCoins || 0);
                        return priceA - priceB;
                    });
                case 'price-high':
                    return sorted.sort((a, b) => {
                        const priceA = a.type === 'coins' ? parseFloat(a.price) : (a.priceInCoins || 0);
                        const priceB = b.type === 'coins' ? parseFloat(b.price) : (b.priceInCoins || 0);
                        return priceB - priceA;
                    });
                case 'name-asc':
                    return sorted.sort((a, b) => a.name.localeCompare(b.name));
                case 'name-desc':
                    return sorted.sort((a, b) => b.name.localeCompare(a.name));
                case 'popular':
                    // Sort by limited edition first, then by price (higher = more popular)
                    return sorted.sort((a, b) => {
                        if (a.limitedEdition && !b.limitedEdition) return -1;
                        if (!a.limitedEdition && b.limitedEdition) return 1;
                        return parseFloat(b.price) - parseFloat(a.price);
                    });
                default:
                    return sorted;
            }
        }

            if (index > -1) {

            localStorage.setItem('jnjWishlist', JSON.stringify(wishlist));

        // Filter items based on category and search
        function filterItems() {

                        categoryMatch = item.limitedEdition === true;
                    } else {
                        categoryMatch = item.type === currentCategory;
                    }

                // Search filter
                const searchMatch = !searchQuery || 
                    item.name.toLowerCase().includes(searchQuery) ||
                    item.description.toLowerCase().includes(searchQuery) ||
                    item.id.toLowerCase().includes(searchQuery);

                return categoryMatch && searchMatch;

                    }

            `;

        // Show notification
        function showNotification(type, title, message) {
            const notification = document.getElementById('notification');
            const notificationIcon = document.getElementById('notificationIcon');
            const notificationTitle = document.getElementById('notificationTitle');
            const notificationMessage = document.getElementById('notificationMessage');

            if (!notification) return;

            // Set icon based on type
            if (type === 'success') {
                notificationIcon.textContent = '✅';
                notification.className = 'notification success show';
            } else if (type === 'error') {
                notificationIcon.textContent = '❌';
                notification.className = 'notification error show';
            } else {
                notificationIcon.textContent = 'ℹ️';
                notification.className = 'notification show';
            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            // Auto-hide after 5 seconds
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        // Purchase item
        async function purchaseItem(itemId) {
            // Validate and clean itemId
            if (!itemId) {
                console.error('purchaseItem called with no itemId');
                showNotification('error', '❌ Error', 'No item selected!');
                return;
            }

            // Trim whitespace and ensure it's a string
            itemId = String(itemId).trim();

            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) {
                console.error('Item not found:', itemId, 'Available items:', SHOP_ITEMS.map(i => i.id));
                showNotification('error', '❌ Error', `Item not found: ${itemId}`);
                return;
            }

            // Get user info
            let customerEmail = 'Not provided';
            let userId = null;
            let username = 'Not provided';
            try {
                if (window.authSystem && window.authSystem.isAuthenticated()) {
                    const user = window.authSystem.getUser();
                    if (user) {
                        if (user.email) customerEmail = user.email;
                        if (user.uid) userId = user.uid;
                    }
                    
                    // Get username from profile
                    const profileData = localStorage.getItem(PROFILE_STORAGE_KEY);
                    if (profileData) {
                        try {
                            const profile = JSON.parse(profileData);
                            if (profile.username && profile.username.trim() !== '') {
                                username = profile.username.trim();
                            } else if (profile.displayName && profile.displayName.trim() !== '') {
                                username = profile.displayName.trim();
                            }
                        } catch (e) {
                            console.warn('Error parsing profile:', e);
                        }
                    }
                }
            } catch (error) {
                console.warn('Could not get user info:', error);
            }

            // Check if already purchased (skip for coin purchases)
            if (item.type !== 'coins') {
            const alreadyPurchased = await hasPurchasedItem(itemId);
            if (alreadyPurchased) {
                showNotification('error', '❌ Already Purchased', 'You have already purchased this item!');
                renderShopItems(); // Refresh to show purchased status
                return;
            }
            }
            
            // Handle coin purchases (add coins)
            if (item.type === 'coins') {
                // For coin purchases, we still need payment, but we grant coins
                // The actual payment is still handled the same way
                // After payment is confirmed, coins will be added
            } else {
                // For regular items, check if user has enough coins
                const currentCoins = loadCoins();
                if (currentCoins < item.priceInCoins) {
                    const needed = item.priceInCoins - currentCoins;
                    showNotification('error', '❌ Insufficient Coins', `You need ${needed} more coins to purchase this item.\n\nYou have: ${currentCoins} 🪙\nRequired: ${item.priceInCoins} 🪙`);
                    return;
                }
            }

            // Purchase confirmation is now handled by modal

            // Show loading
                const loadingMsg = document.createElement('div');
                loadingMsg.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0, 0, 0, 0.9);
                    color: white;
                    padding: 30px;
                    border-radius: 10px;
                    z-index: 10000;
                    text-align: center;
                    font-size: 18px;
                `;
                loadingMsg.textContent = 'Processing purchase...';
                document.body.appendChild(loadingMsg);

                try {
                // Initialize Firebase if needed
                if (!db) {
                    initFirebase();
                }

                if (!db) {
                    throw new Error('Firebase not available');
                }

                // Save purchase to Firestore
                const purchaseData = {
                    itemId: item.id,
                    itemName: item.name,
                    itemType: item.type,
                    price: item.price,
                    grantType: item.grantType,
                    grantValue: item.grantValue,
                    customerEmail: customerEmail,
                    userId: userId,
                    username: username,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'pending',
                    granted: false
                };

                await db.collection('purchases').add(purchaseData);
                console.log('Purchase saved to Firestore');

                // For coin purchases, coins are handled on the buy-coins page
                // For regular items, deduct coins and instantly grant the item
                if (item.type !== 'coins') {
                    // Deduct coins for regular purchases
                    const coinsDeducted = await deductCoins(item.priceInCoins);
                    if (!coinsDeducted) {
                        throw new Error('Failed to deduct coins');
                    }
                    
                    // Instantly grant the item (no dev approval needed for coin purchases)
                if (userId) {
                    try {
                        const userDoc = await db.collection('users').doc(userId).get();
                        let userData = {};
                        let profile = {};
                        
                        if (userDoc.exists) {
                            userData = userDoc.data();
                            profile = { ...(userData.profile || {}) };
                        }
                        
                        // Add itemId to purchasedItems array
                        const purchasedItems = profile.purchasedItems || [];
                        if (!purchasedItems.includes(item.id)) {
                            purchasedItems.push(item.id);
                            profile.purchasedItems = purchasedItems;
                                
                                // Grant the item based on type
                                if (item.grantType === 'title') {
                                    const titles = profile.unlockedTitles || [];
                                    if (!titles.includes(item.grantValue)) {
                                        titles.push(item.grantValue);
                                        profile.unlockedTitles = titles;
                                    }
                                } else if (item.grantType === 'profile-image') {
                                    const images = profile.unlockedImages || [];
                                    if (!images.includes(item.grantValue)) {
                                        images.push(item.grantValue);
                                        profile.unlockedImages = images;
                                    }
                                } else if (item.grantType === 'vip') {
                                    profile.isVip = true;
                                }
                            
                            // Update user profile in Firestore
                            if (userDoc.exists) {
                                await db.collection('users').doc(userId).update({
                                    profile: profile
                                });
                            } else {
                                await db.collection('users').doc(userId).set({
                                    profile: profile,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                            
                            // Update localStorage if this is the current user
                            if (window.authSystem && window.authSystem.isAuthenticated()) {
                                const currentUser = window.authSystem.getUser();
                                if (currentUser && currentUser.uid === userId) {
                                    const localProfile = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || '{}');
                                    localProfile.purchasedItems = purchasedItems;
                                        if (item.grantType === 'title') {
                                            localProfile.unlockedTitles = profile.unlockedTitles;
                                        } else if (item.grantType === 'profile-image') {
                                            localProfile.unlockedImages = profile.unlockedImages;
                                        } else if (item.grantType === 'vip') {
                                            localProfile.isVip = true;
                                        }
                                    localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(localProfile));
                                    
                                    // Sync to Firestore via authSystem
                                    try {
                                        await window.authSystem.saveUserData({ profile: localProfile });
                                    } catch (e) {
                                        console.error('Error syncing profile:', e);
                                    }
                                }
                            }
                        }
                    } catch (e) {
                            console.error('Error granting item:', e);
                        // Don't block the purchase if this fails
                        }
                    }
                }

                // Remove loading
                    document.body.removeChild(loadingMsg);

                // Show purchase success animation
                showPurchaseSuccess(item.name);

                // Track quest progress
                if (typeof window.trackPurchase === 'function') {
                    window.trackPurchase();
                }
                
                // Also show notification
                showNotification(
                    'success',
                    '✅ Purchase Successful!',
                    `Thank you for purchasing ${item.name} for ${item.priceInCoins} 🪙.\n\n🎉 Your item has been instantly granted! Check your profile to see it.`
                );

                // Refresh shop items to show purchased status
                renderShopItems();
            } catch (error) {
                console.error('Purchase error:', error);
                if (document.body.contains(loadingMsg)) {
                    document.body.removeChild(loadingMsg);
                }
                showNotification(
                    'error',
                    '❌ Purchase Error',
                    'Error processing purchase. Please try again.'
                );
            }
        }

        // Load purchases for dev view
        async function loadPurchases() {
            const devPurchases = document.getElementById('devPurchases');
            const purchasesList = document.getElementById('purchasesList');
            
            if (!isDev()) {
                if (devPurchases) devPurchases.classList.remove('visible');
                return;
            }

            if (!devPurchases || !purchasesList) return;

            devPurchases.classList.add('visible');
            purchasesList.innerHTML = '<div class="no-purchases">Loading purchases...</div>';

            try {
                if (!db) {
                    initFirebase();
                }

                if (!db) {
                    purchasesList.innerHTML = '<div class="no-purchases">Firebase not available</div>';
                    return;
                }

                // Get all purchases, ordered by timestamp
                const purchasesSnapshot = await db.collection('purchases')
                    .orderBy('timestamp', 'desc')
                    .get();

                if (purchasesSnapshot.empty) {
                    purchasesList.innerHTML = '<div class="no-purchases">No purchases yet</div>';
                    return;
                }

                purchasesList.innerHTML = '';

                purchasesSnapshot.forEach(doc => {
                    const purchase = doc.data();
                    const purchaseId = doc.id;
                    
                    // Format timestamp
                    let timestampStr = 'Unknown';
                    if (purchase.timestamp) {
                        if (purchase.timestamp.toDate) {
                            timestampStr = purchase.timestamp.toDate().toLocaleString();
                        } else if (purchase.timestamp.seconds) {
                            timestampStr = new Date(purchase.timestamp.seconds * 1000).toLocaleString();
                        }
                    }

                    const purchaseDiv = document.createElement('div');
                    purchaseDiv.className = 'purchase-item';
                    purchaseDiv.innerHTML = `
                        <div class="purchase-info">
                            <strong>${purchase.itemName || 'Unknown Item'}</strong>
                            <span>Price: $${purchase.price || '0.00'}</span>
                            <span>Username: ${purchase.username || 'Not provided'}</span>
                            <span>Email: ${purchase.customerEmail || 'Not provided'}</span>
                            <span>User ID: ${purchase.userId || 'N/A'}</span>
                            <span>Date: ${timestampStr}</span>
                            <span>Status: ${purchase.granted ? '✅ Granted' : '⏳ Pending'}</span>
                            <span>Grant: ${purchase.grantType === 'title' ? 'Title: ' + purchase.grantValue : purchase.grantType === 'vip' ? 'VIP Pass (title + icon + benefits)' : purchase.grantValue}</span>
                        </div>
                        <button class="grant-button" 
                                onclick="grantItem('${purchaseId}', '${purchase.userId || ''}', '${purchase.grantType}', '${purchase.grantValue}')"
                                ${purchase.granted ? 'disabled' : ''}>
                            ${purchase.granted ? 'Already Granted' : 'Grant Item'}
                        </button>
                    `;

                    purchasesList.appendChild(purchaseDiv);
                });
            } catch (error) {
                console.error('Error loading purchases:', error);
                purchasesList.innerHTML = '<div class="no-purchases">Error loading purchases</div>';
            }
        }

        // Grant item to user
        async function grantItem(purchaseId, userId, grantType, grantValue) {
            let itemType = 'item';
            if (grantType === 'title') {
                itemType = 'title';
            } else if (grantType === 'vip') {
                itemType = 'VIP Pass (title + icon + benefits)';
            } else if (grantType === 'profile-image') {
                itemType = 'profile image';
            }
            
            if (!confirm(`Grant ${itemType}: ${grantValue} to user ${userId || 'N/A'}?`)) {
                return;
            }

            try {
                if (!db) {
                    initFirebase();
                }

                if (!db) {
                    showNotification('error', '❌ Error', 'Firebase not available');
                    return;
                }

                // Update purchase status
                await db.collection('purchases').doc(purchaseId).update({
                    granted: true,
                    grantedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Ensure item is in user's purchasedItems (in case purchase record gets deleted)
                if (userId) {
                    try {
                        const userDoc = await db.collection('users').doc(userId).get();
                        let userData = {};
                        let profile = {};
                        
                        if (userDoc.exists) {
                            userData = userDoc.data();
                            profile = { ...(userData.profile || {}) };
                        }
                        
                        // Get the itemId from the purchase
                        const purchaseDoc = await db.collection('purchases').doc(purchaseId).get();
                        if (purchaseDoc.exists) {
                            const purchaseData = purchaseDoc.data();
                            const itemId = purchaseData.itemId;
                            
                            if (itemId) {
                                const purchasedItems = profile.purchasedItems || [];
                                if (!purchasedItems.includes(itemId)) {
                                    purchasedItems.push(itemId);
                                    profile.purchasedItems = purchasedItems;
                                    
                                    // Update user profile
                                    if (userDoc.exists) {
                                        await db.collection('users').doc(userId).update({
                                            profile: profile
                                        });
                                    } else {
                                        await db.collection('users').doc(userId).set({
                                            profile: profile,
                                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                        });
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.error('Error ensuring purchasedItems:', e);
                        // Don't block the grant if this fails
                    }
                }

                // Grant the item to the user
                if (userId) {
                    // Get user's profile from Firestore
                    const userDoc = await db.collection('users').doc(userId).get();
                    let userData = {};
                    let profile = {};
                    
                    if (userDoc.exists) {
                        userData = userDoc.data();
                        // Preserve all existing profile fields
                        profile = { ...(userData.profile || {}) };
                    }

                    if (grantType === 'title') {
                        const unlockedTitles = profile.unlockedTitles || [];

                        // Add title if not already unlocked
                        if (!unlockedTitles.includes(grantValue)) {
                            unlockedTitles.push(grantValue);
                            profile.unlockedTitles = unlockedTitles;
                            console.log('Added title to unlockedTitles:', grantValue, 'Full array:', unlockedTitles);
                        } else {
                            console.log('Title already unlocked:', grantValue);
                        }
                    } else if (grantType === 'vip') {
                        // VIP Pass grants multiple things
                        const unlockedTitles = profile.unlockedTitles || [];
                        const unlockedImages = profile.unlockedImages || [];

                        // Add VIP title
                        if (!unlockedTitles.includes('vip')) {
                            unlockedTitles.push('vip');
                            profile.unlockedTitles = unlockedTitles;
                            console.log('Added VIP title to unlockedTitles');
                        }

                        // Add VIP icon
                        if (!unlockedImages.includes('vip-icon')) {
                            unlockedImages.push('vip-icon');
                            profile.unlockedImages = unlockedImages;
                            console.log('Added VIP icon to unlockedImages');
                        }

                        // Set VIP status
                        profile.isVip = true;
                        console.log('Set isVip to true');
                    } else if (grantType === 'profile-image') {
                        const unlockedImages = profile.unlockedImages || [];

                        // Add profile image if not already unlocked
                        if (!unlockedImages.includes(grantValue)) {
                            unlockedImages.push(grantValue);
                            profile.unlockedImages = unlockedImages;
                            console.log('Added profile image to unlockedImages:', grantValue, 'Full array:', unlockedImages);
                        } else {
                            console.log('Profile image already unlocked:', grantValue);
                        }
                    }

                    // Update user profile in Firestore - preserve all existing fields
                    if (userDoc.exists) {
                        // Use update to preserve other fields in the document
                        await db.collection('users').doc(userId).update({
                            profile: profile
                        });
                        console.log('Updated user profile in Firestore with profile:', JSON.stringify(profile));
                    } else {
                        // User document doesn't exist, create it
                        await db.collection('users').doc(userId).set({
                            profile: profile,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        console.log('Created new user document in Firestore');
                    }

                    // Force reload user data to ensure titles are visible
                    // Also update localStorage if this is the current user and sync to Firestore
                    if (window.authSystem && window.authSystem.isAuthenticated()) {
                        const currentUser = window.authSystem.getUser();
                        if (currentUser && currentUser.uid === userId) {
                            // Reload user data from Firestore to get the latest profile
                            try {
                                await window.authSystem.loadUserData(userId);
                                console.log('Reloaded user data from Firestore');
                            } catch (e) {
                                console.error('Error reloading user data:', e);
                            }
                            
                            const localProfile = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || '{}');
                            // Merge with the updated profile from Firestore
                            if (grantType === 'title') {
                                localProfile.unlockedTitles = profile.unlockedTitles || [];
                                console.log('Updated localStorage unlockedTitles:', localProfile.unlockedTitles);
                            } else if (grantType === 'vip') {
                                localProfile.unlockedTitles = profile.unlockedTitles || [];
                                localProfile.unlockedImages = profile.unlockedImages || [];
                                localProfile.isVip = profile.isVip || false;
                                console.log('Updated localStorage for VIP:', {
                                    titles: localProfile.unlockedTitles,
                                    images: localProfile.unlockedImages,
                                    isVip: localProfile.isVip
                                });
                            } else if (grantType === 'profile-image') {
                                localProfile.unlockedImages = profile.unlockedImages || [];
                                console.log('Updated localStorage unlockedImages:', localProfile.unlockedImages);
                            }
                            localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(localProfile));
                            
                            // Also save to Firestore via authSystem to ensure sync
                            try {
                                await window.authSystem.saveUserData({ profile: localProfile });
                                console.log('Synced profile to Firestore via authSystem');
                            } catch (e) {
                                console.error('Error syncing profile:', e);
                            }
                        }
                    }
                } else {
                    console.warn('No userId provided, cannot grant item');
                }

                // Delete all granted purchases except the last 3
                await cleanupOldGrantedPurchases();

                showNotification('success', '✅ Item Granted', 'Item granted successfully!');
                loadPurchases(); // Refresh the list
                } catch (error) {
                console.error('Error granting item:', error);
                showNotification('error', '❌ Error', 'Error granting item. Please try again.');
            }
        }

        // Clean up old granted purchases, keeping only the last 3
        async function cleanupOldGrantedPurchases() {
            try {
                if (!db) {
                    initFirebase();
                }

                if (!db) {
                    console.warn('Firebase not available for cleanup');
                    return;
                }

                // Get all granted purchases
                const grantedPurchasesSnapshot = await db.collection('purchases')
                    .where('granted', '==', true)
                    .get();

                if (grantedPurchasesSnapshot.empty) {
                    return; // No granted purchases to clean up
                }

                const grantedPurchases = [];
                grantedPurchasesSnapshot.forEach(doc => {
                    const data = doc.data();
                    grantedPurchases.push({
                        id: doc.id,
                        grantedAt: data.grantedAt ? (data.grantedAt.toDate ? data.grantedAt.toDate() : new Date(data.grantedAt.seconds * 1000)) : new Date(0), // Use epoch if no grantedAt
                        data: data
                    });
                });

                // Sort by grantedAt (most recent first), then by timestamp as fallback
                grantedPurchases.sort((a, b) => {
                    const aTime = a.grantedAt.getTime();
                    const bTime = b.grantedAt.getTime();
                    if (aTime !== bTime) {
                        return bTime - aTime; // Descending (newest first)
                    }
                    // Fallback to timestamp if grantedAt is the same
                    const aTimestamp = a.data.timestamp ? (a.data.timestamp.toDate ? a.data.timestamp.toDate() : new Date(a.data.timestamp.seconds * 1000)) : new Date(0);
                    const bTimestamp = b.data.timestamp ? (b.data.timestamp.toDate ? b.data.timestamp.toDate() : new Date(b.data.timestamp.seconds * 1000)) : new Date(0);
                    return bTimestamp.getTime() - aTimestamp.getTime();
                });

                // If we have more than 3 granted purchases, delete the older ones
                if (grantedPurchases.length > 3) {
                    const purchasesToDelete = grantedPurchases.slice(3); // Skip first 3, delete the rest
                    
                    console.log(`Cleaning up ${purchasesToDelete.length} old granted purchases, keeping the last 3`);
                    
                    // Delete each old granted purchase
                    const deletePromises = purchasesToDelete.map(purchase => {
                        return db.collection('purchases').doc(purchase.id).delete();
                    });

                    await Promise.all(deletePromises);
                    console.log(`Successfully deleted ${purchasesToDelete.length} old granted purchases`);
                }
            } catch (error) {
                console.error('Error cleaning up old granted purchases:', error);
                // Don't throw - this is a cleanup operation, shouldn't block the grant
            }
        }

        // Sync coins to Firebase periodically (every 30 seconds if authenticated)
        function startCoinSync() {
            setInterval(async () => {
                if (window.authSystem && window.authSystem.isAuthenticated()) {
                    const coins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                    await saveCoinsToFirebase(coins);
                }
            }, 30000); // Every 30 seconds
        }

        // Initialize page
        function initPage() {
            initFilters();
            showFeaturedItem();
            
            // Load coins from Firebase profile on page load (minimal reads - only when entering shop)
            loadCoinsFromFirebase().then(() => {
                // If Firebase load fails or user not authenticated, fallback to localStorage
                const coins = loadCoins();
                if (coins === 0) {
                    // Try localStorage as fallback
                    const localCoins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                    if (localCoins > 0) {
                        updateCoinsDisplay(localCoins);
                    }
                }
            });
            
            renderShopItems();
            
            // Start periodic coin sync
            startCoinSync();
            
            // Listen for auth state changes to reload coins
            window.addEventListener('authStateChanged', async (event) => {
                if (event.detail && event.detail.user) {
                    // User logged in - sync coins to Firebase
                    const coins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                    await saveCoinsToFirebase(coins);
                }
                setTimeout(() => {
                    loadCoinsFromFirebase();
                    renderShopItems(); // Refresh to update purchase status
                }, 500);
            });
        }

        // Initialize Firebase and page when ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initFirebase();
                initPage();
            });
        } else {
            initFirebase();
            initPage();
        }
    </script>
