<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quests - JNJ Website</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="animated-background.css">
    <link rel="stylesheet" href="background-music.css">
    <script src="animated-background.js" defer></script>
    <script src="page-transitions.js" defer></script>
    <script src="background-music.js" defer></script>
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="auth.js" defer></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-color: #22c55e;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .quests-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .quests-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .quests-title {
            font-size: 48px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .quests-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .coins-display {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 50px;
            padding: 12px 24px;
            margin-top: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
        }

        .coins-icon {
            font-size: 24px;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
        }

        .coins-amount {
            font-size: 24px;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .quests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .quest-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .quest-card.completed {
            border-color: var(--success-color);
            background: rgba(34, 197, 94, 0.1);
        }

        .quest-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .quest-icon {
            font-size: 40px;
            margin-right: 15px;
        }

        .quest-info {
            flex: 1;
        }

        .quest-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .quest-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .quest-progress {
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--gold-gradient);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-text {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: right;
        }

        .quest-reward {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #FFD700;
        }

        .quest-status {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
        }

        .claim-button {
            width: 100%;
            padding: 12px;
            background: var(--gold-gradient);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .claim-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
        }

        .claim-button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            max-width: 400px;
            transform: translateX(500px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid var(--success-color);
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="quests-container">
            <div class="quests-header">
                <h1 class="quests-title">⚔️ Quests ⚔️</h1>
                <p class="quests-subtitle">Complete quests to earn JNJ Coins! (3 active quests at a time)</p>
                <div class="coins-display" id="coinsDisplay">
                    <span class="coins-icon">🪙</span>
                    <span class="coins-amount" id="coinsAmount">0</span>
                    <span class="coins-label">JNJ Coins</span>
                </div>
                <a href="index.html" class="back-button">← Back to Home</a>
            </div>

            <div class="quests-grid" id="questsGrid">
                <!-- Quests will be dynamically added here -->
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        const PROFILE_STORAGE_KEY = 'jnjUserProfile';
        const COINS_STORAGE_KEY = 'jnjCoins';
        const QUESTS_STORAGE_KEY = 'jnjQuests';
        
        // Quest definitions - harder quests with very few coins
        const ALL_QUESTS = [
            {
                id: 'social-butterfly',
                name: 'Social Butterfly',
                icon: '💬',
                description: 'Send 50 messages in chat',
                target: 50,
                current: 0,
                reward: 1,
                type: 'chat-messages',
                completed: false,
                claimed: false
            },
            {
                id: 'collector',
                name: 'Collector',
                icon: '🏆',
                description: 'Unlock 5 titles',
                target: 5,
                current: 0,
                reward: 2,
                type: 'unlock-titles',
                completed: false,
                claimed: false
            },
            {
                id: 'chat-master',
                name: 'Chat Master',
                icon: '💭',
                description: 'Send 200 messages in chat',
                target: 200,
                current: 0,
                reward: 3,
                type: 'chat-messages',
                completed: false,
                claimed: false
            },
            {
                id: 'secret-hunter',
                name: 'Secret Hunter',
                icon: '🔍',
                description: 'Unlock 3 secret pages',
                target: 3,
                current: 0,
                reward: 2,
                type: 'unlock-secret',
                completed: false,
                claimed: false
            },
            {
                id: 'shopaholic',
                name: 'Shopaholic',
                icon: '🛍️',
                description: 'Make 3 purchases',
                target: 3,
                current: 0,
                reward: 3,
                type: 'purchases',
                completed: false,
                claimed: false
            },
            {
                id: 'legendary-chatter',
                name: 'Legendary Chatter',
                icon: '🗣️',
                description: 'Send 500 messages in chat',
                target: 500,
                current: 0,
                reward: 5,
                type: 'chat-messages',
                completed: false,
                claimed: false
            },
            {
                id: 'title-master',
                name: 'Title Master',
                icon: '👑',
                description: 'Unlock 10 titles',
                target: 10,
                current: 0,
                reward: 4,
                type: 'unlock-titles',
                completed: false,
                claimed: false
            }
        ];
        
        // Active quests (only 3 shown at a time)
        let QUESTS = [];

        // Initialize Firebase
        let db = null;
        function initFirebase() {
            try {
                if (typeof firebase === 'undefined' || !firebaseConfig) {
                    return false;
                }
                
                if (!firebase.apps || firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                
                db = firebase.firestore();
                return true;
            } catch (error) {
                console.error('Firebase initialization error:', error);
                return false;
            }
        }

        // Get daily quest count (resets each day)
        function getDailyQuestCount() {
            try {
                const dailyData = localStorage.getItem('jnjDailyQuestCount');
                if (dailyData) {
                    const data = JSON.parse(dailyData);
                    const today = new Date().toDateString();
                    if (data.date === today) {
                        return data.count || 0;
                    }
                }
                return 0;
            } catch (e) {
                return 0;
            }
        }
        
        // Increment daily quest count
        function incrementDailyQuestCount() {
            try {
                const today = new Date().toDateString();
                const count = getDailyQuestCount() + 1;
                localStorage.setItem('jnjDailyQuestCount', JSON.stringify({
                    date: today,
                    count: count
                }));
                return count;
            } catch (e) {
                return 0;
            }
        }
        
        // Select 3 random active quests
        function selectActiveQuests() {
            try {
                // Load saved active quests
                const savedActive = localStorage.getItem('jnjActiveQuests');
                if (savedActive) {
                    const savedIds = JSON.parse(savedActive);
                    QUESTS = ALL_QUESTS.filter(q => savedIds.includes(q.id));
                    // Only keep active if all 3 are still available and not all completed/claimed
                    if (QUESTS.length === 3) {
                        const allCompleted = QUESTS.every(q => q.completed && q.claimed);
                        if (!allCompleted) {
                            return; // Already have 3 active quests that aren't all done
                        }
                    }
                }
                
                // Select 3 random quests that aren't completed and claimed
                const availableQuests = ALL_QUESTS.filter(q => !(q.completed && q.claimed));
                if (availableQuests.length === 0) {
                    // All quests completed, reset them or show message
                    QUESTS = ALL_QUESTS.slice(0, 3);
                } else {
                    const shuffled = availableQuests.sort(() => 0.5 - Math.random());
                    QUESTS = shuffled.slice(0, Math.min(3, availableQuests.length));
                }
                
                // Save active quest IDs
                localStorage.setItem('jnjActiveQuests', JSON.stringify(QUESTS.map(q => q.id)));
            } catch (e) {
                console.error('Error selecting active quests:', e);
                // Fallback to first 3
                QUESTS = ALL_QUESTS.slice(0, 3);
            }
        }
        
        // Add a new quest when one is completed (capped at 4 per day)
        function addNewQuestAfterCompletion() {
            const dailyCount = getDailyQuestCount();
            if (dailyCount >= 4) {
                // Already got 4 new quests today
                return false;
            }
            
            // Check if we have less than 3 active quests
            const activeQuests = QUESTS.filter(q => !(q.completed && q.claimed));
            if (activeQuests.length >= 3) {
                // Already have 3 active quests
                return false;
            }
            
            // Find available quests that aren't already active
            const currentActiveIds = QUESTS.map(q => q.id);
            const availableQuests = ALL_QUESTS.filter(q => 
                !(q.completed && q.claimed) && 
                !currentActiveIds.includes(q.id)
            );
            
            if (availableQuests.length === 0) {
                return false; // No more quests available
            }
            
            // Select a random available quest
            const shuffled = availableQuests.sort(() => 0.5 - Math.random());
            const newQuest = shuffled[0];
            
            // Add to active quests (make sure we have the full quest object from ALL_QUESTS)
            const fullQuest = ALL_QUESTS.find(q => q.id === newQuest.id);
            if (fullQuest) {
                QUESTS.push(fullQuest);
                
                // Increment daily count
                incrementDailyQuestCount();
                
                // Save active quest IDs
                localStorage.setItem('jnjActiveQuests', JSON.stringify(QUESTS.map(q => q.id)));
                
                return true;
            }
            
            return false;
        }
        
        // Load quest progress
        function loadQuestProgress() {
            try {
                const questData = localStorage.getItem(QUESTS_STORAGE_KEY);
                if (questData) {
                    const savedQuests = JSON.parse(questData);
                    // Merge saved progress with all quest definitions
                    ALL_QUESTS.forEach(quest => {
                        const saved = savedQuests.find(q => q.id === quest.id);
                        if (saved) {
                            quest.current = saved.current || 0;
                            quest.completed = saved.completed || false;
                            quest.claimed = saved.claimed || false;
                        }
                    });
                }
                
                // Update active quests with progress
                QUESTS.forEach(quest => {
                    const fullQuest = ALL_QUESTS.find(q => q.id === quest.id);
                    if (fullQuest) {
                        quest.current = fullQuest.current;
                        quest.completed = fullQuest.completed;
                        quest.claimed = fullQuest.claimed;
                    }
                });
            } catch (e) {
                console.error('Error loading quest progress:', e);
            }
        }

        // Save quest progress
        function saveQuestProgress() {
            try {
                // Save all quests, not just active ones
                localStorage.setItem(QUESTS_STORAGE_KEY, JSON.stringify(ALL_QUESTS));
                
                // Also save to Firebase if authenticated
                if (window.authSystem && window.authSystem.isAuthenticated()) {
                    saveQuestProgressToFirebase();
                }
            } catch (e) {
                console.error('Error saving quest progress:', e);
            }
        }

        // Save quest progress to Firebase
        async function saveQuestProgressToFirebase() {
            try {
                if (!window.authSystem || !window.authSystem.isAuthenticated()) {
                    return;
                }
                
                const user = window.authSystem.getUser();
                if (!user || !user.uid) {
                    return;
                }
                
                if (!db) {
                    initFirebase();
                }
                
                if (!db) {
                    return;
                }
                
                const questData = ALL_QUESTS.map(q => ({
                    id: q.id,
                    current: q.current,
                    completed: q.completed,
                    claimed: q.claimed
                }));
                
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.exists ? userDoc.data() : {};
                const profile = { ...(userData.profile || {}) };
                profile.quests = questData;
                
                if (userDoc.exists) {
                    await db.collection('users').doc(user.uid).update({
                        profile: profile
                    });
                } else {
                    await db.collection('users').doc(user.uid).set({
                        profile: profile,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            } catch (e) {
                console.error('Error saving quest progress to Firebase:', e);
            }
        }

        // Load quest progress from Firebase
        async function loadQuestProgressFromFirebase() {
            try {
                if (!window.authSystem || !window.authSystem.isAuthenticated()) {
                    return;
                }
                
                const user = window.authSystem.getUser();
                if (!user || !user.uid) {
                    return;
                }
                
                if (!db) {
                    initFirebase();
                }
                
                if (!db) {
                    return;
                }
                
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    const profile = userData.profile || {};
                    const savedQuests = profile.quests || [];
                    
                    // Merge Firebase data with all quest definitions
                    savedQuests.forEach(saved => {
                        const quest = ALL_QUESTS.find(q => q.id === saved.id);
                        if (quest) {
                            quest.current = saved.current || 0;
                            quest.completed = saved.completed || false;
                            quest.claimed = saved.claimed || false;
                        }
                    });
                    
                    // Update active quests
                    selectActiveQuests();
                    
                    saveQuestProgress();
                }
            } catch (e) {
                console.error('Error loading quest progress from Firebase:', e);
            }
        }

        // Update quest progress
        function updateQuestProgress(questType, amount = 1) {
            let updated = false;
            // Update all quests of this type, not just active ones
            ALL_QUESTS.forEach(quest => {
                if (quest.type === questType && !quest.completed) {
                    const oldCurrent = quest.current;
                    quest.current = Math.min(quest.current + amount, quest.target);
                    if (quest.current >= quest.target && !quest.completed) {
                        quest.completed = true;
                        updated = true;
                    }
                    // Also update if progress changed
                    if (quest.current !== oldCurrent) {
                        updated = true;
                    }
                }
            });
            
            // Update active quests display
            QUESTS.forEach(quest => {
                const fullQuest = ALL_QUESTS.find(q => q.id === quest.id);
                if (fullQuest) {
                    quest.current = fullQuest.current;
                    quest.completed = fullQuest.completed;
                }
            });
            
            if (updated) {
                saveQuestProgress();
                renderQuests();
            }
        }

        // Claim quest reward
        async function claimQuestReward(questId) {
            const quest = ALL_QUESTS.find(q => q.id === questId);
            if (!quest || !quest.completed) {
                return;
            }

            // Check if already claimed (prevent double claiming)
            if (quest.claimed) {
                showNotification('This quest reward has already been claimed!');
                return;
            }
            
            // If this quest is completed and claimed, select a new active quest
            const wasActive = QUESTS.find(q => q.id === questId);

            try {
                // Add coins
                const currentCoins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                const newCoins = currentCoins + quest.reward;
                localStorage.setItem(COINS_STORAGE_KEY, newCoins.toString());
                updateCoinsDisplay(newCoins);

                // Save coins to Firebase
                if (window.authSystem && window.authSystem.isAuthenticated()) {
                    const user = window.authSystem.getUser();
                    if (user && user.uid) {
                        if (!db) {
                            initFirebase();
                        }
                        
                        if (db) {
                            const userDoc = await db.collection('users').doc(user.uid).get();
                            const userData = userDoc.exists ? userDoc.data() : {};
                            const profile = { ...(userData.profile || {}) };
                            profile.coins = newCoins;
                            
                            if (userDoc.exists) {
                                await db.collection('users').doc(user.uid).update({
                                    profile: profile
                                });
                            } else {
                                await db.collection('users').doc(user.uid).set({
                                    profile: profile,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                            
                            // Sync via authSystem
                            try {
                                await window.authSystem.saveUserData({ profile: profile });
                            } catch (e) {
                                console.error('Error syncing coins:', e);
                            }
                        }
                    }
                } else {
                    // Not authenticated, just save to localStorage (will sync on next login)
                    localStorage.setItem(COINS_STORAGE_KEY, newCoins.toString());
                }

                // Mark as claimed
                quest.claimed = true;
                
                // If this was an active quest, try to add a new one (capped at 4 per day)
                if (wasActive) {
                    const addedNew = addNewQuestAfterCompletion();
                    if (!addedNew) {
                        // Couldn't add new quest (either at daily limit or no more available)
                        // Just refresh the active quests list
                        selectActiveQuests();
                    }
                }
                
                saveQuestProgress();

                const dailyCount = getDailyQuestCount();
                const notificationMsg = dailyCount >= 4 
                    ? `✅ Quest completed! You earned ${quest.reward} 🪙 coins! (Daily limit reached - no new quests today)`
                    : `✅ Quest completed! You earned ${quest.reward} 🪙 coins!`;
                showNotification(notificationMsg, 'success');
                renderQuests();
            } catch (e) {
                console.error('Error claiming quest reward:', e);
                showNotification('Error claiming reward. Please try again.');
            }
        }

        // Render quests
        function renderQuests() {
            const questsGrid = document.getElementById('questsGrid');
            if (!questsGrid) return;

            questsGrid.innerHTML = '';

            QUESTS.forEach(quest => {
                const questCard = document.createElement('div');
                questCard.className = `quest-card ${quest.completed ? 'completed' : ''}`;
                
                const progressPercent = Math.min((quest.current / quest.target) * 100, 100);
                const canClaim = quest.completed && !quest.claimed;

                questCard.innerHTML = `
                    ${quest.completed ? '<div class="quest-status">✅</div>' : ''}
                    <div class="quest-header">
                        <div class="quest-icon">${quest.icon}</div>
                        <div class="quest-info">
                            <div class="quest-name">${quest.name}</div>
                            <div class="quest-description">${quest.description}</div>
                        </div>
                    </div>
                    <div class="quest-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="progress-text">${quest.current} / ${quest.target}</div>
                    </div>
                    <div class="quest-reward">
                        <span>🪙</span>
                        <span>${quest.reward} Coins</span>
                    </div>
                    ${canClaim ? 
                        `<button class="claim-button" onclick="claimQuestReward('${quest.id}')">Claim Reward</button>` :
                        quest.claimed ? 
                            `<button class="claim-button" disabled>Claimed ✓</button>` :
                            `<button class="claim-button" disabled>In Progress...</button>`
                    }
                `;

                questsGrid.appendChild(questCard);
            });
        }

        // Load coins
        function loadCoins() {
            try {
                const coins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                updateCoinsDisplay(coins);
                return coins;
            } catch (e) {
                return 0;
            }
        }

        function updateCoinsDisplay(coins) {
            const coinsAmount = document.getElementById('coinsAmount');
            if (coinsAmount) {
                coinsAmount.textContent = coins.toLocaleString();
            }
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            if (!notification) return;

            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Initialize page
        async function initPage() {
            // Select active quests first
            selectActiveQuests();
            
            // Load quest progress from localStorage first
            loadQuestProgress();
            
            // Load coins and quest progress from Firebase in a single read
            if (window.authSystem && window.authSystem.isAuthenticated()) {
                const user = window.authSystem.getUser();
                if (user && user.uid) {
                    if (!db) {
                        initFirebase();
                    }
                    
                    if (db) {
                        try {
                            // Single read to get both coins and quest progress
                            const userDoc = await db.collection('users').doc(user.uid).get();
                            if (userDoc.exists) {
                                const userData = userDoc.data();
                                const profile = userData.profile || {};
                                
                                // Load coins
                                const coins = profile.coins || 0;
                                localStorage.setItem(COINS_STORAGE_KEY, coins.toString());
                                updateCoinsDisplay(coins);
                                
                                // Load quest progress
                                const savedQuests = profile.quests || [];
                                savedQuests.forEach(saved => {
                                    const quest = ALL_QUESTS.find(q => q.id === saved.id);
                                    if (quest) {
                                        quest.current = saved.current || 0;
                                        quest.completed = saved.completed || false;
                                        quest.claimed = saved.claimed || false;
                                    }
                                });
                                
                                // Update active quests with loaded progress
                                QUESTS.forEach(quest => {
                                    const fullQuest = ALL_QUESTS.find(q => q.id === quest.id);
                                    if (fullQuest) {
                                        quest.current = fullQuest.current;
                                        quest.completed = fullQuest.completed;
                                        quest.claimed = fullQuest.claimed;
                                    }
                                });
                                
                                selectActiveQuests();
                                saveQuestProgress();
                            } else {
                                // No profile, default to 0
                                localStorage.setItem(COINS_STORAGE_KEY, '0');
                                updateCoinsDisplay(0);
                            }
                        } catch (e) {
                            console.error('Error loading from Firebase:', e);
                            // Fallback to localStorage
                            const localCoins = parseInt(localStorage.getItem(COINS_STORAGE_KEY) || '0');
                            updateCoinsDisplay(localCoins);
                        }
                    }
                }
            } else {
                // Not authenticated, use localStorage
                loadCoins();
            }
            
            // Check quest progress based on user data
            checkQuestProgress();
            
            renderQuests();
        }

        // Check quest progress from user data
        function checkQuestProgress() {
            try {
                const profileData = localStorage.getItem(PROFILE_STORAGE_KEY);
                let profile = null;
                
                if (profileData) {
                    profile = JSON.parse(profileData);
                    
                    // Check titles
                    const titles = profile.unlockedTitles || [];
                    if (titles.length > 0) {
                        ALL_QUESTS.forEach(quest => {
                            if (quest.type === 'unlock-titles' && !quest.completed) {
                                quest.current = Math.min(titles.length, quest.target);
                                if (quest.current >= quest.target) {
                                    quest.completed = true;
                                }
                            }
                        });
                    }
                    
                    // Check purchases
                    const purchases = profile.purchasedItems || [];
                    if (purchases.length > 0) {
                        ALL_QUESTS.forEach(quest => {
                            if (quest.type === 'purchases' && !quest.completed) {
                                quest.current = Math.min(purchases.length, quest.target);
                                if (quest.current >= quest.target) {
                                    quest.completed = true;
                                }
                            }
                        });
                    }
                }
                
                // Check secrets
                const secrets = localStorage.getItem('jnjSecretPages');
                if (secrets) {
                    try {
                        const secretsData = JSON.parse(secrets);
                        const unlockedSecrets = Object.values(secretsData).filter(s => s === true).length;
                        if (unlockedSecrets > 0) {
                            ALL_QUESTS.forEach(quest => {
                                if (quest.type === 'unlock-secret' && !quest.completed) {
                                    quest.current = Math.min(unlockedSecrets, quest.target);
                                    if (quest.current >= quest.target) {
                                        quest.completed = true;
                                    }
                                }
                            });
                        }
                    } catch (e) {
                        // Ignore
                    }
                }
                
                // Check chat messages
                const messageCount = parseInt(localStorage.getItem('jnjMessageCount') || '0');
                if (messageCount > 0) {
                    ALL_QUESTS.forEach(quest => {
                        if (quest.type === 'chat-messages' && !quest.completed) {
                            quest.current = Math.min(messageCount, quest.target);
                            if (quest.current >= quest.target) {
                                quest.completed = true;
                            }
                        }
                    });
                }
                
                // Check visited pages
                const visitedPages = localStorage.getItem('visitedPages');
                if (visitedPages) {
                    try {
                        const pages = JSON.parse(visitedPages);
                        const uniquePages = new Set(pages).size;
                        if (uniquePages > 0) {
                            ALL_QUESTS.forEach(quest => {
                                if (quest.type === 'visit-pages' && !quest.completed) {
                                    quest.current = Math.min(uniquePages, quest.target);
                                    if (quest.current >= quest.target) {
                                        quest.completed = true;
                                    }
                                }
                            });
                        }
                    } catch (e) {
                        // Ignore
                    }
                }
                
                // Update active quests display
                QUESTS.forEach(quest => {
                    const fullQuest = ALL_QUESTS.find(q => q.id === quest.id);
                    if (fullQuest) {
                        quest.current = fullQuest.current;
                        quest.completed = fullQuest.completed;
                    }
                });
                
                saveQuestProgress();
            } catch (e) {
                console.error('Error checking quest progress:', e);
            }
        }

        // Wait for DOM and auth system
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(initPage, 500);
            });
        } else {
            setTimeout(initPage, 500);
        }
    </script>
</body>
</html>
