<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">

 <title>Vanguard - Airsoft FPS (Trench War)</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
 <script type="module">
     import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
     import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
     import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


     window.initFirebase = async function() {
         if (typeof __firebase_config === 'undefined') {
             console.warn("Firebase config not found. Multiplayer disabled.");
             return null;
         }
         const app = initializeApp(JSON.parse(__firebase_config));
         const auth = getAuth(app);
         const db = getFirestore(app);
         const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
      
         try {
             if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                 await signInWithCustomToken(auth, __initial_auth_token);
             } else {
                 await signInAnonymously(auth);
             }
         } catch (error) {
             console.error("Firebase Authentication Error:", error);
             return null;
         }
      
         return { auth, db, appId };
     };
  
     window.firebaseModules = { collection, doc, setDoc, onSnapshot, serverTimestamp, onAuthStateChanged };
 </script>


 <style>
     body { margin: 0; overflow: hidden; background: #050505; font-family: 'Courier New', Courier, monospace; user-select: none; }
     #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

     }
     #hit-marker {

     }
     #damage-flash {

     }
     #wave-display {
         position: absolute; top: 30px; right: 30px;

         text-align: right;
     }
     #interaction-prompt {
         position: absolute; top: 60%; left: 50%; transform: translateX(-50%);
         color: #ffd700; font-size: 16px; font-weight: bold; letter-spacing: 2px;
         text-shadow: 0 0 5px rgba(0,0,0,0.8); display: none;
     }
     #notification-area {
         position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
         display: flex; flex-direction: column; align-items: center; gap: 10px;
         pointer-events: none;
     }
     .notification {
         background: rgba(0, 50, 100, 0.8); color: #00ffff; border: 1px solid #00ffff;
         padding: 10px 20px; font-weight: bold; letter-spacing: 2px;
         animation: fadeOut 4s forwards;
     }
     @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }


     #menu {
         position: absolute; top: 0; left: 0; width: 100%; height: 100%;
         background: radial-gradient(circle, #111 0%, #000 100%);
         display: flex; flex-direction: column;
         align-items: center; justify-content: center;
         color: white; pointer-events: auto; z-index: 100;
     }
     #loading-screen {
         position: absolute; top: 0; left: 0; width: 100%; height: 100%;
         background: #000; z-index: 200;
         display: none; flex-direction: column; align-items: center; justify-content: center;
         color: white; pointer-events: none;
     }
     .blink { animation: blinker 1s linear infinite; }
     @keyframes blinker { 50% { opacity: 0.0; } }


     .menu-section { display: none; flex-direction: column; align-items: center; width: 100%; }
     .menu-active { display: flex; }
  
     button {
         padding: 18px 50px; font-size: 14px;
         color: white; border: 1px solid rgba(255,255,255,0.2);
         cursor: pointer;
         text-transform: uppercase; font-weight: bold; letter-spacing: 3px;
         background: rgba(255,255,255,0.05);
         transition: all 0.2s;
     }
     button:hover { background: white; color: black; border-color: white; letter-spacing: 5px; }
  
     .btn-col { border-left: 5px solid #ffffff; }
     .btn-reb { border-left: 5px solid #333333; }
     .btn-mode { width: 350px; margin: 10px; }
  
     .key { color: #00aaff; border: 1px solid rgba(0,170,255,0.3); padding: 2px 8px; margin: 0 4px; }
 </style>
</head>
<body>


 <div id="ui-layer">
     <div id="crosshair"></div>
     <div id="hit-marker"></div>
     <div id="damage-flash"></div>
     <div id="wave-display"></div>
     <div id="team-badge">COLONISTS</div>
     <div id="health-container"><div id="health-bar"></div></div>
     <div id="weapon-card">
         <div id="weapon-name">MSBS GROT B</div>

 </div>


 <div id="loading-screen">
     <h1 style="font-size: 40px; font-weight: 900; letter-spacing: 5px;" class="blink">ESTABLISHING UPLINK...</h1>
     <p style="margin-top: 20px; font-family: monospace; color: #00aaff;">CONNECTING TO SECURE SECTOR</p>
 </div>


 <div id="menu">
     <h1 style="font-size: 80px; font-weight: 900; margin: 0; letter-spacing: -2px;">VANGUARD</h1>
     <p style="letter-spacing: 12px; margin-bottom: 40px; opacity: 0.5; font-size: 10px;">TACTICAL OPERATIONS SIMULATOR</p>
  
     <div id="mode-select" class="menu-section menu-active">
         <button class="btn-mode" onclick="selectMode('SP')">CAMPAIGN (WAVES)</button>

             <p><span class="key">WASD</span> TO MANEUVER <span class="key">SHIFT</span> OVERDRIVE</p>
             <p><span class="key">MB1</span> ENGAGE <span class="key">MB2</span> OPTICS</p>

         </div>
         <div class="menu-buttons" style="display: flex; gap: 20px;">
             <button id="col-btn" class="btn-col">JOIN COLONISTS</button>
             <button id="reb-btn" class="btn-reb">JOIN REBAB</button>
         </div>
     </div>
 </div>


 <script>
     const PLAYER_HEIGHT = 1.6;
     const PLAYER_SPEED = 12.0;
     const SPRINT_SPEED = 20.0;
     const FRICTION = 8.0;
     const JUMP_FORCE = 12.0;
     const GRAVITY = 30.0;
     const SENSITIVITY = 0.002;
    
     const HEALTH_REGEN_DELAY = 5.0;
     const HEALTH_REGEN_RATE = 15.0;


     const WEAPONS = [
         { name: "MSBS GROT B", damage: 28, fireRate: 0.1, magSize: 30, color: 0x2a2a2a, recoil: 0.012, recoilZ: 0.08, recoilPitch: 0.05, unlocked: true, requiredKills: 0 },
         { name: "APC9 PRO", damage: 18, fireRate: 0.07, magSize: 30, color: 0x282828, recoil: 0.008, recoilZ: 0.04, recoilPitch: 0.03, unlocked: false, requiredKills: 5 },
         { name: "Vector 45", damage: 15, fireRate: 0.05, magSize: 33, color: 0x121212, recoil: 0.006, recoilZ: 0.03, recoilPitch: 0.02, unlocked: false, requiredKills: 10 },
         { name: "SCAR H", damage: 40, fireRate: 0.15, magSize: 20, color: 0x6e5e40, recoil: 0.022, recoilZ: 0.12, recoilPitch: 0.08, unlocked: false, requiredKills: 15 },
         { name: "AK-12", damage: 32, fireRate: 0.11, magSize: 30, color: 0x1a1a1a, recoil: 0.016, recoilZ: 0.10, recoilPitch: 0.06, unlocked: false, requiredKills: 20 },
         { name: "M870 MCS", damage: 12, fireRate: 0.85, magSize: 8, color: 0x333333, recoil: 0.05, recoilZ: 0.25, recoilPitch: 0.15, pellets: 8, spread: 0.1, unlocked: false, requiredKills: 25 }
     ];


     let camera, scene, renderer;
     let playerVelocity = new THREE.Vector3();
     let gunContainer = new THREE.Group();
     let gunParent = new THREE.Group();
     let keys = {};
     let canJump = false, prevTime = performance.now();
     let currentWeaponIdx = 0, currentAmmo = 30, isReloading = false, lastShotTime = 0, isAiming = false, isFiring = false;
     let playerHP = 100;
     let lastDamageTime = 0;
     let pellets = [], enemies = [], enemyPellets = [], droppedMags = [], activeGrenades = [];
     let chests = [];
     let collidableObjects = [];
     let levelMeshes = [];
     let activeMag = null, activeChargingHandle = null, handleDefaultZ = 0;
     let leftArm, rightArm;
     let playerTeam = 'COLONISTS';
     let muzzleFlash;
     let isLoading = false;
     let currentMapType = 'TRENCH';
     let lastGrenadeTime = 0;
     let killCount = 0;
     const GRENADE_COOLDOWN = 4.0;
  
     let currentGameMode = null;
     let waveNumber = 0;


     let fbAuth, fbDb, fbAppId;
     let remotePlayers = {};
     let myUserId = null;
     let lastSyncTime = 0;


     let mouseSwayX = 0, mouseSwayY = 0;
     let bobTime = 0;
     let recoilPos = 0;
     let recoilRot = 0;
     let targetGunPos = new THREE.Vector3(0.3, -0.25, -0.5);
     let currentGunPos = new THREE.Vector3().copy(targetGunPos);


     const projectileRaycaster = new THREE.Raycaster();


     function createNoiseTexture(color1, color2, size=256) {
         const canvas = document.createElement('canvas');
         canvas.width = size; canvas.height = size;
         const ctx = canvas.getContext('2d');
         for(let i=0; i<size; i++) {
             for(let j=0; j<size; j++) {
                 const noise = Math.random();
                 ctx.fillStyle = noise > 0.5 ? color1 : color2;
                 ctx.fillRect(i, j, 1, 1);
             }
         }
         const tex = new THREE.CanvasTexture(canvas);
         tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
         return tex;
     }


     function createPlayerModel(teamColor, isEnemy = true) {
         const group = new THREE.Group();
        
         // Enhanced visibility: Fresnel/Glow color
         const glowColor = isEnemy ? 0xff3300 : 0x00ccff;


         const bodyGeo = new THREE.BoxGeometry(0.6, 1.3, 0.4);
         const bodyMat = new THREE.MeshStandardMaterial({
             color: teamColor,
             roughness: 0.2,
             emissive: glowColor,
             emissiveIntensity: 0.15 // Subtle glow to make them pop out of shadows
         });
         const body = new THREE.Mesh(bodyGeo, bodyMat);
         body.position.y = 0.65;
         body.castShadow = true;
         body.receiveShadow = true;
         group.add(body);


         const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
         const headMat = new THREE.MeshStandardMaterial({ color: 0xddc0a0, roughness: 0.5 });
         const head = new THREE.Mesh(headGeo, headMat);
         head.position.y = 1.45;
         head.castShadow = true;
         group.add(head);


         const visorGeo = new THREE.BoxGeometry(0.36, 0.1, 0.2);
         const visorMat = new THREE.MeshStandardMaterial({
             color: glowColor,
             emissive: glowColor,
             emissiveIntensity: 1.0,
             roughness: 0.2
         });
         const visor = new THREE.Mesh(visorGeo, visorMat);
         visor.position.set(0, 1.48, -0.1);
         group.add(visor);


         // Team Marker (Floating Icon above head)
         if (!isEnemy) {
             const markerGeo = new THREE.OctahedronGeometry(0.12);
             const markerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
             const marker = new THREE.Mesh(markerGeo, markerMat);
             marker.position.y = 2.1;
             group.add(marker);
             group.teamMarker = marker; // Reference for animation
         }


         return group;
     }


     function showNotification(text) {
         const container = document.getElementById('notification-area');
         if (!container) return;
         const div = document.createElement('div');
         div.className = 'notification';
         div.innerText = text;
         container.appendChild(div);
         setTimeout(() => {
             if(div.parentElement) div.parentElement.removeChild(div);
         }, 4000);
     }


     window.selectMode = function(mode) {
         currentGameMode = mode;
         document.getElementById('mode-select').classList.remove('menu-active');
         document.getElementById('map-select').classList.add('menu-active');
     };


     window.selectMap = function(map) {
         currentMapType = map;
         document.getElementById('map-select').classList.remove('menu-active');
         document.getElementById('team-select').classList.add('menu-active');
       
         if(currentGameMode === 'SP') {
             document.getElementById('wave-display').innerText = "SECTOR CLEARANCE - WAVE 1";
         } else {
             document.getElementById('wave-display').innerText = "LIVE OPERATION";
         }
     };


     function init() {
         scene = new THREE.Scene();
         scene.background = new THREE.Color(0x050608);
         scene.fog = new THREE.FogExp2(0x0a0c10, 0.025);


         camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
         camera.position.y = PLAYER_HEIGHT;
      
         camera.add(gunParent);
         gunParent.add(gunContainer);
         scene.add(camera);


         const ambient = new THREE.AmbientLight(0x404050, 0.4); // Slightly brighter ambient
         scene.add(ambient);


         const moonLight = new THREE.DirectionalLight(0x7788ff, 0.8);
         moonLight.position.set(50, 100, 50);
         moonLight.castShadow = true;
         moonLight.shadow.mapSize.width = 2048;
         moonLight.shadow.mapSize.height = 2048;
         scene.add(moonLight);


         const hemiLight = new THREE.HemisphereLight(0x445566, 0x111122, 0.5);
         scene.add(hemiLight);


         muzzleFlash = new THREE.PointLight(0xffaa44, 0, 10);
         muzzleFlash.visible = false;
         gunContainer.add(muzzleFlash);


         renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
         renderer.setPixelRatio(window.devicePixelRatio);
         renderer.setSize(window.innerWidth, window.innerHeight);
         renderer.shadowMap.enabled = true;
         document.body.appendChild(renderer.domElement);


         loadLevel('TRENCH');
         loadWeaponModel(0);
      
         document.addEventListener('keydown', (e) => {
             keys[e.code] = true;
             if(e.code === 'KeyR') reload();
             if(e.code === 'KeyG') throwGrenade();
             if(e.code === 'KeyE') tryInteract();
             if(e.code.startsWith('Digit')) {
                 const idx = parseInt(e.code.replace('Digit','')) - 1;
                 if(idx >= 0 && idx < WEAPONS.length) switchWeapon(idx);
             }
             if(e.code === 'Space' && canJump) {
                 playerVelocity.y += JUMP_FORCE;
                 canJump = false;
             }
         });
         document.addEventListener('keyup', (e) => keys[e.code] = false);
      
         document.addEventListener('mousedown', (e) => {
             if (document.pointerLockElement !== document.body) return;
             if (e.button === 0) isFiring = true;
             if (e.button === 2) setAim(true);
         });
         document.addEventListener('mouseup', (e) => {
             if (e.button === 0) isFiring = false;
             if (e.button === 2) setAim(false);
         });
         document.addEventListener('mousemove', (e) => {
             if (document.pointerLockElement === document.body && !isLoading) {
                 camera.rotation.y -= e.movementX * SENSITIVITY;
                 camera.rotation.x -= e.movementY * SENSITIVITY;
                 camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                 mouseSwayX += e.movementX * 0.0008;
                 mouseSwayY += e.movementY * 0.0008;
             }
         });


         window.addEventListener('resize', onResize);
      
         document.getElementById('col-btn').addEventListener('click', () => startGame('COLONISTS'));
         document.getElementById('reb-btn').addEventListener('click', () => startGame('REBAB'));


         document.addEventListener('pointerlockchange', () => {
             const locked = document.pointerLockElement === document.body;
             if(!locked) {
                 document.getElementById('menu').style.display = 'flex';
                 isFiring = false;
             } else {
                 document.getElementById('menu').style.display = 'none';
             }
         });


         animate();
     }


     async function startGame(team) {
         playerTeam = team;
         playerHP = 100;
         lastDamageTime = performance.now() / 1000;
         killCount = 0;
       
         loadLevel(currentMapType);


         document.body.requestPointerLock();
         prevTime = performance.now();


         if (currentGameMode === 'MP') {
             const loadingScreen = document.getElementById('loading-screen');
             const menu = document.getElementById('menu');
             menu.style.display = 'none';
             loadingScreen.style.display = 'flex';
             isLoading = true;


             const delayPromise = new Promise(r => setTimeout(r, 2000));
             let fbPromise = Promise.resolve();
           
             if (window.initFirebase) {
                 fbPromise = window.initFirebase();
             }


             const [_, fb] = await Promise.all([delayPromise, fbPromise]);


             if (fb) {
                 fbAuth = fb.auth; fbDb = fb.db; fbAppId = fb.appId;
                 myUserId = fbAuth.currentUser ? fbAuth.currentUser.uid : null;
                 const { collection, onSnapshot } = window.firebaseModules;
                 const playersRef = collection(fbDb, 'artifacts', fbAppId, 'public', 'data', 'vanguard_players');
                 onSnapshot(playersRef, (snapshot) => {
                     const now = Date.now();
                     snapshot.docChanges().forEach((change) => {
                         const data = change.doc.data();
                         const uid = change.doc.id;
                         if (uid === myUserId) return;
                         if (change.type === "added" || change.type === "modified") {
                             if (now - data.ts > 10000) {
                                 if (remotePlayers[uid]) { scene.remove(remotePlayers[uid].mesh); delete remotePlayers[uid]; }
                                 return;
                             }
                             updateRemotePlayer(uid, data);
                         }
                         if (change.type === "removed") {
                             if (remotePlayers[uid]) { scene.remove(remotePlayers[uid].mesh); delete remotePlayers[uid]; }
                         }
                     });
                 });
             }


             isLoading = false;
             loadingScreen.style.display = 'none';


         } else if (currentGameMode === 'SP') {
             waveNumber = 0;
             enemies.forEach(e => scene.remove(e.mesh));
             enemies = [];
             startWave();
         }
       
         const badge = document.getElementById('team-badge');
         badge.innerText = `UNIT: ${team}`;
         badge.style.borderLeftColor = team === 'COLONISTS' ? '#ffffff' : '#333333';
      
         loadWeaponModel(currentWeaponIdx);
         updateHUD();
     }


     function updateRemotePlayer(uid, data) {
         const isEnemy = data.team !== playerTeam;
         if (!remotePlayers[uid]) {
             const color = data.team === 'COLONISTS' ? 0xffffff : 0x1a1a1a;
             const mesh = createPlayerModel(color, isEnemy);
             scene.add(mesh);
             remotePlayers[uid] = { mesh: mesh, data: data };
         }
         const p = remotePlayers[uid];
         p.mesh.position.set(data.x, data.y, data.z);
         p.mesh.rotation.y = data.rotY;
     }


     function syncNetwork() {
         if (!fbDb || !myUserId || currentGameMode !== 'MP') return;
         const now = Date.now();
         if (now - lastSyncTime < 50) return;
         lastSyncTime = now;
         const { doc, setDoc } = window.firebaseModules;
         const ref = doc(fbDb, 'artifacts', fbAppId, 'public', 'data', 'vanguard_players', myUserId);
         const dir = new THREE.Vector3();
         camera.getWorldDirection(dir);
         const rotY = Math.atan2(dir.x, dir.z);
         setDoc(ref, { x: camera.position.x, y: camera.position.y - 1.6, z: camera.position.z, rotY: rotY + Math.PI, team: playerTeam, weapon: currentWeaponIdx, ts: now }).catch(e => {});
     }


     function startWave() {
         waveNumber++;
         document.getElementById('wave-display').innerText = `SECTOR CLEARANCE - WAVE ${waveNumber}`;
         const enemyCount = 3 + waveNumber * 2;
         for(let i=0; i<enemyCount; i++) spawnEnemy();
     }


     function switchWeapon(idx) {
         if(isReloading || currentWeaponIdx === idx) return;
         if (!WEAPONS[idx].unlocked) return;
         currentWeaponIdx = idx;
         currentAmmo = WEAPONS[idx].magSize;
         loadWeaponModel(idx);
         updateHUD();
     }


     function checkUnlocks() {
         WEAPONS.forEach((w, i) => {
             if(!w.unlocked && killCount >= w.requiredKills) {
                 w.unlocked = true;
                 showNotification(`UNLOCKED: ${w.name}`);
             }
         });
     }


     function createChest(x, z) {
         const group = new THREE.Group();
         group.position.set(x, 0.5, z);
         const geo = new THREE.BoxGeometry(1.2, 0.8, 0.8);
         const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.4, metalness: 0.7 });
         const mesh = new THREE.Mesh(geo, mat);
         mesh.castShadow = true;
         group.add(mesh);
         const lid = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.1, 0.9), mat);
         lid.position.y = 0.4;
         group.add(lid);
         scene.add(group);
         chests.push({ mesh: group, opened: false });
     }


     function spawnChests() {
         for(let i=0; i<5; i++) {
             const x = (Math.random()-0.5)*80;
             const z = (Math.random()-0.5)*80;
             createChest(x, z);

     function tryInteract() {
         const playerPos = new THREE.Vector2(camera.position.x, camera.position.z);
         for(let i=0; i<chests.length; i++) {
             const c = chests[i];
             const dist = playerPos.distanceTo(new THREE.Vector2(c.mesh.position.x, c.mesh.position.z));
             if(dist < 3.0) {
                 openChest(i);
                 return;
             }
         }
     }


     function openChest(idx) {
         const c = chests[idx];
         scene.remove(c.mesh);
         chests.splice(idx, 1);
         const lockedWeapons = WEAPONS.map((w, i) => ({...w, idx: i})).filter(w => !w.unlocked);
         if(lockedWeapons.length > 0) {
             const choice = lockedWeapons[Math.floor(Math.random() * lockedWeapons.length)];
             WEAPONS[choice.idx].unlocked = true;
             switchWeapon(choice.idx);
             showNotification(`SCAVENGED: ${choice.name}`);
         } else {
             currentAmmo = WEAPONS[currentWeaponIdx].magSize;
             showNotification("AMMO REPLENISHED");
             updateHUD();
         }
     }

     function addBox(parent, w, h, d, x, y, z, mat, rotX=0) {
         const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
         mesh.position.set(x, y, z);
         if(rotX) mesh.rotation.x = rotX;
         mesh.castShadow = true; mesh.receiveShadow = true;
         parent.add(mesh);
         return mesh;
     }
     function addCylinder(parent, rt, rb, h, x, y, z, mat, rotX=0) {
         const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 32), mat);
         mesh.position.set(x, y, z);
         if(rotX) mesh.rotation.x = THREE.MathUtils.degToRad(rotX);
         mesh.castShadow = true; mesh.receiveShadow = true;
         parent.add(mesh);
         return mesh;
     }


     function loadLevel(type) {
         levelMeshes.forEach(mesh => scene.remove(mesh));

         if (type === 'TRENCH') {
             createTrenchLevel();
         } else if (type === 'DUBLIN') {
             createDublinLevel();
         }
         spawnChests();
     }

     function createTrenchLevel() {
         const mudTex = createNoiseTexture('#2a1e15', '#3d2b1f');
         mudTex.repeat.set(50, 50);
         const mudMat = new THREE.MeshStandardMaterial({ map: mudTex, roughness: 1.0, metalness: 0.1 });
         const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), mudMat);
         ground.rotation.x = -Math.PI/2;
         ground.receiveShadow = true;
         scene.add(ground);
         collidableObjects.push(ground);
         levelMeshes.push(ground);


         const woodTex = createNoiseTexture('#4a3622', '#5a4632');
         woodTex.repeat.set(4, 4);
         const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.9 });
         const dirtMat = new THREE.MeshStandardMaterial({ color: 0x1a110a, roughness: 1.0 });


         function addTrench(x, z, length, width, rot = 0) {
             const group = new THREE.Group();
             group.position.set(x, 0, z);
             group.rotation.y = rot;
             const floor = new THREE.Mesh(new THREE.BoxGeometry(width, 0.1, length), woodMat);
             floor.position.y = 0.05;
             floor.receiveShadow = true;
             group.add(floor);
             collidableObjects.push(floor);
             const wallHeight = 2.5;
             const leftWall = addBox(group, 0.5, wallHeight, length, -width/2 - 0.25, wallHeight/2, 0, dirtMat);
             const rightWall = addBox(group, 0.5, wallHeight, length, width/2 + 0.25, wallHeight/2, 0, dirtMat);
             collidableObjects.push(leftWall, rightWall);
             for(let i = -length/2; i < length/2; i += 3) {
                 addBox(group, 0.2, wallHeight, 0.2, -width/2, wallHeight/2, i, woodMat);
                 addBox(group, 0.2, wallHeight, 0.2, width/2, wallHeight/2, i, woodMat);
             }
             scene.add(group);
             levelMeshes.push(group);
         }


         addTrench(0, 0, 80, 4);
         addTrench(20, 10, 40, 3, Math.PI/2);
         addTrench(-20, -10, 40, 3, Math.PI/2);
      
         function addBunker(x, z) {
             const group = new THREE.Group();
             group.position.set(x, 0, z);
             const wallMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.4, metalness: 0.5 });
             const roof = addBox(group, 10, 0.5, 10, 0, 3.5, 0, wallMat);
             const w1 = addBox(group, 0.5, 3.5, 10, -5, 1.75, 0, wallMat);
             const w2 = addBox(group, 0.5, 3.5, 10, 5, 1.75, 0, wallMat);
             const w3 = addBox(group, 10, 3.5, 0.5, 0, 1.75, 5, wallMat);
             collidableObjects.push(roof, w1, w2, w3);
             scene.add(group);
             levelMeshes.push(group);
         }


         addBunker(0, 45); addBunker(0, -45); addBunker(45, 10); addBunker(-45, -10);


         for(let i=0; i<40; i++) {
             const crate = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), woodMat);
             crate.position.set((Math.random()-0.5)*120, 0.75, (Math.random()-0.5)*120);
             crate.castShadow = true; crate.receiveShadow = true;
             scene.add(crate);
             collidableObjects.push(crate);
             levelMeshes.push(crate);
         }
     }

     function throwGrenade() {
         const now = performance.now() / 1000;
         if (now - lastGrenadeTime < GRENADE_COOLDOWN) return;
         lastGrenadeTime = now;
         const g = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({ color: 0x004400 }));
         const dir = new THREE.Vector3();
         camera.getWorldDirection(dir);
         g.position.copy(camera.position).add(dir.clone().multiplyScalar(0.5));
         scene.add(g);
         const vel = dir.clone().multiplyScalar(15).add(new THREE.Vector3(0, 3, 0));
         activeGrenades.push({ mesh: g, vel: vel, timer: 3.0 });
         const icon = document.getElementById('grenade-icon');
         icon.style.opacity = 0.3; icon.innerText = "[G] REARMING...";
         setTimeout(() => { icon.style.opacity = 0.8; icon.innerText = "[G] FRAG READY"; }, GRENADE_COOLDOWN * 1000);
     }


     function updateGrenades(delta) {
         for (let i = activeGrenades.length - 1; i >= 0; i--) {
             const g = activeGrenades[i];
             g.timer -= delta;
             g.vel.y -= GRAVITY * delta;
             g.mesh.position.add(g.vel.clone().multiplyScalar(delta));
             if (g.mesh.position.y < 0.1) {
                 g.mesh.position.y = 0.1;
                 g.vel.y *= -0.5;
                 g.vel.x *= 0.8;
                 g.vel.z *= 0.8;
             }
             if (g.timer <= 0) {
                 explodeGrenade(g);
                 activeGrenades.splice(i, 1);
             }
         }
     }


     function explodeGrenade(grenade) {
         scene.remove(grenade.mesh);
         const flash = new THREE.PointLight(0xff5500, 2, 20);
         flash.position.copy(grenade.mesh.position);
         scene.add(flash);
         setTimeout(() => scene.remove(flash), 150);
         const blastGeo = new THREE.SphereGeometry(4, 16, 16);
         const blastMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.5 });
         const blast = new THREE.Mesh(blastGeo, blastMat);
         blast.position.copy(grenade.mesh.position);
         scene.add(blast);
         setTimeout(() => scene.remove(blast), 100);
         const radius = 8.0;
         const damage = 120;
         for (let i = enemies.length - 1; i >= 0; i--) {
             const e = enemies[i];
             const dist = e.mesh.position.distanceTo(grenade.mesh.position);
             if (dist < radius) {
                 e.hp -= damage * (1 - dist / radius);
                 if (e.hp <= 0) {
                     scene.remove(e.mesh);
                     killCount++;
                     checkUnlocks();
                     enemies.splice(i, 1);
                 }
             }
         }
         const pDist = camera.position.distanceTo(grenade.mesh.position);
         if (pDist < radius) {
             damagePlayer(damage * (1 - pDist / radius));
         }
     }


     function reload() {
         if (isReloading || currentAmmo === WEAPONS[currentWeaponIdx].magSize) return;
         isReloading = true;
         document.getElementById('weapon-name').innerText = "RELOADING...";
         if (activeMag) {
             const worldPos = new THREE.Vector3(); activeMag.getWorldPosition(worldPos);
             const clone = activeMag.clone();
             clone.position.copy(worldPos);
             clone.rotation.copy(activeMag.rotation);
             scene.add(clone);
             droppedMags.push({ mesh: clone, vel: new THREE.Vector3(0, -3, 0), rotVel: new THREE.Vector3(Math.random(), Math.random(), Math.random()), life: 2.0 });
             activeMag.visible = false;
         }
         setTimeout(() => {
             if (activeChargingHandle) activeChargingHandle.position.z = handleDefaultZ + 0.15;
         }, 800);
         setTimeout(() => {
             if (activeChargingHandle) activeChargingHandle.position.z = handleDefaultZ;
             if (activeMag) activeMag.visible = true;
             currentAmmo = WEAPONS[currentWeaponIdx].magSize;
             isReloading = false;
             updateHUD();
         }, 1600);
     }


     function updateHUD() {
         const w = WEAPONS[currentWeaponIdx];
         const weaponNameEl = document.getElementById('weapon-name');
         const ammoDisplayEl = document.getElementById('ammo-display');
         const healthBarEl = document.getElementById('health-bar');
         if (weaponNameEl) weaponNameEl.innerText = isReloading ? "RELOADING..." : w.name;
         if (ammoDisplayEl) ammoDisplayEl.innerText = `${currentAmmo} / ${w.magSize}`;
         if (healthBarEl) healthBarEl.style.width = `${playerHP}%`;
         const interactionPrompt = document.getElementById('interaction-prompt');
         if (interactionPrompt) {
             let nearChest = false;
             const playerPos = new THREE.Vector2(camera.position.x, camera.position.z);
             for(const c of chests) {
                 if(playerPos.distanceTo(new THREE.Vector2(c.mesh.position.x, c.mesh.position.z)) < 3.0) {
                     nearChest = true; break;
                 }
             }
             interactionPrompt.style.display = nearChest ? 'block' : 'none';
         }
     }


     function setAim(aiming) {
         isAiming = aiming;
         if (isAiming) targetGunPos.set(0, -0.165, -0.2);
         else targetGunPos.set(0.3, -0.25, -0.5);
     }


     function fire() {
         const now = performance.now() / 1000;
         const w = WEAPONS[currentWeaponIdx];
         if (now - lastShotTime < w.fireRate || isReloading || currentAmmo <= 0) {
             if(currentAmmo <= 0 && !isReloading) reload();
             return;
         }
         lastShotTime = now;
         currentAmmo--;
         updateHUD();
         recoilPos += w.recoilZ;
         recoilRot += w.recoilPitch;
         muzzleFlash.visible = true;
         setTimeout(() => muzzleFlash.visible = false, 50);
         const pelletCount = w.pellets || 1;
         const spread = w.spread || 0;
         for(let i=0; i<pelletCount; i++) {
             const spreadX = (Math.random() - 0.5) * spread;
             const spreadY = (Math.random() - 0.5) * spread;
             projectileRaycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
             const intersects = projectileRaycaster.intersectObjects(scene.children, true);
             let hitPoint = null;
             for(let hit of intersects) {
                 if(hit.object === gunContainer || gunContainer.children.includes(hit.object)) continue;
                 let hitEnemy = null;
                 let obj = hit.object;
                 while(obj.parent && obj.parent !== scene) {
                     for(let e of enemies) if(e.mesh === obj.parent) hitEnemy = e;
                     if(hitEnemy) break;
                     obj = obj.parent;
                 }
                 if(!hitEnemy) {
                     for(let e of enemies) if(e.mesh === hit.object) hitEnemy = e;
                 }
                 if(hitEnemy) {
                     hitEnemy.hp -= w.damage;
                     showHitMarker();
                     if(hitEnemy.hp <= 0) {
                         scene.remove(hitEnemy.mesh);
                         killCount++;
                         checkUnlocks();
                         enemies = enemies.filter(e => e !== hitEnemy);
                         if(enemies.length === 0 && currentGameMode === 'SP') setTimeout(startWave, 2000);
                     }
                     hitPoint = hit.point;
                     break;
                 } else if (!hit.object.isProjectile) {
                     hitPoint = hit.point;
                     const spark = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), new THREE.MeshBasicMaterial({color: 0xffff00}));
                     spark.position.copy(hit.point);
                     scene.add(spark);
                     setTimeout(() => scene.remove(spark), 500);
                     break;
                 }
             }
         }
     }


     function showHitMarker() {
         const marker = document.getElementById('hit-marker');
         if (marker) {
             marker.style.opacity = 1;
             setTimeout(() => marker.style.opacity = 0, 100);
         }
     }


     function damagePlayer(amount) {
         playerHP -= amount;
         lastDamageTime = performance.now() / 1000;
         const flash = document.getElementById('damage-flash');
         if (flash) {
             flash.style.opacity = 1;
             setTimeout(() => flash.style.opacity = 0, 300);
         }
         updateHUD();
         if(playerHP <= 0) {
             document.exitPointerLock();
             alert("CRITICAL FAILURE - SECTOR LOST");
             location.reload();
         }
     }


     function onResize() {
         camera.aspect = window.innerWidth / window.innerHeight;
         camera.updateProjectionMatrix();
         renderer.setSize(window.innerWidth, window.innerHeight);
     }


     function animate() {
         requestAnimationFrame(animate);
         const time = performance.now();
         const delta = Math.min((time - prevTime) / 1000, 0.1);
         prevTime = time;


         // Team Marker Animation
         Object.values(remotePlayers).forEach(p => {
             if (p.mesh.teamMarker) {
                 p.mesh.teamMarker.rotation.y += delta * 2;
                 p.mesh.teamMarker.position.y = 2.1 + Math.sin(time * 0.005) * 0.05;
                 // Look at camera for 2D-like effect
                 p.mesh.teamMarker.lookAt(camera.position);
             }
         });


         if(document.pointerLockElement === document.body && !isLoading) {
             const currentTimeSeconds = time / 1000;
             if (currentTimeSeconds - lastDamageTime > HEALTH_REGEN_DELAY && playerHP < 100) {
                 playerHP = Math.min(100, playerHP + HEALTH_REGEN_RATE * delta);
                 updateHUD();
             }
             const speed = keys['ShiftLeft'] ? SPRINT_SPEED : PLAYER_SPEED;
             const moveDir = new THREE.Vector3();
             if(keys['KeyW']) moveDir.z -= 1;
             if(keys['KeyS']) moveDir.z += 1;
             if(keys['KeyA']) moveDir.x -= 1;
             if(keys['KeyD']) moveDir.x += 1;
             moveDir.normalize();
             const euler = new THREE.Euler(0, camera.rotation.y, 0, 'YXZ');
             moveDir.applyEuler(euler);
             playerVelocity.x += moveDir.x * speed * delta;
             playerVelocity.z += moveDir.z * speed * delta;
             playerVelocity.x -= playerVelocity.x * FRICTION * delta;
             playerVelocity.z -= playerVelocity.z * FRICTION * delta;
             playerVelocity.y -= GRAVITY * delta;
             camera.position.x += playerVelocity.x * delta;
             camera.position.z += playerVelocity.z * delta;
             camera.position.y += playerVelocity.y * delta;
             if(camera.position.y < PLAYER_HEIGHT) {
                 camera.position.y = PLAYER_HEIGHT;
                 playerVelocity.y = 0;
                 canJump = true;
             }
             mouseSwayX = THREE.MathUtils.lerp(mouseSwayX, 0, delta * 10);
             mouseSwayY = THREE.MathUtils.lerp(mouseSwayY, 0, delta * 10);
             if(playerVelocity.lengthSq() > 1 && !isAiming) {
                 bobTime += delta * (keys['ShiftLeft'] ? 15 : 10);
                 targetGunPos.y = -0.25 + Math.sin(bobTime) * 0.01;
                 targetGunPos.x = 0.3 + Math.cos(bobTime * 0.5) * 0.01;
             } else {
                 if(!isAiming) {
                     targetGunPos.y = -0.25;
                     targetGunPos.x = 0.3;
                 }
             }
             recoilPos = THREE.MathUtils.lerp(recoilPos, 0, delta * 5);
             recoilRot = THREE.MathUtils.lerp(recoilRot, 0, delta * 10);
             currentGunPos.lerp(targetGunPos, delta * 10);
             gunContainer.position.copy(currentGunPos);
             gunContainer.position.z += recoilPos;
             gunContainer.position.x -= mouseSwayX;
             gunContainer.position.y -= mouseSwayY;
             gunContainer.rotation.x = recoilRot;
             gunContainer.rotation.y = -mouseSwayX * 2;
             if(isFiring) fire();
             updateGrenades(delta);
             updateHUD();
             if(currentGameMode === 'SP') {
                 for(let e of enemies) {
                     const dist = e.mesh.position.distanceTo(camera.position);
                     if(dist > 5) {
                         const dir = new THREE.Vector3().subVectors(camera.position, e.mesh.position).normalize();
                         e.mesh.position.add(dir.multiplyScalar(4 * delta));
                         e.mesh.lookAt(camera.position.x, 0.9, camera.position.z);
                     }
                     if(time/1000 - e.lastShot > e.fireRate) {
                         e.lastShot = time/1000;
                         const dirToPlayer = new THREE.Vector3().subVectors(camera.position, e.mesh.position).normalize();
                         projectileRaycaster.set(e.mesh.position, dirToPlayer);
                         const intersects = projectileRaycaster.intersectObjects(collidableObjects, true);
                         if(intersects.length > 0 && intersects[0].distance < dist) {
                             continue;
                         }
                         if(Math.random() < 0.6) damagePlayer(10);
                     }
                 }
             }
         }
         for(let i=droppedMags.length-1; i>=0; i--) {
             const m = droppedMags[i];
             m.life -= delta;
             m.mesh.position.add(m.vel.clone().multiplyScalar(delta));
             m.mesh.rotation.x += m.rotVel.x * delta;
             m.vel.y -= GRAVITY * delta;
             if(m.mesh.position.y < 0.1) {
                 m.mesh.position.y = 0.1;
                 m.vel.set(0,0,0);
                 m.rotVel.set(0,0,0);
             }
             if(m.life <= 0) {
                 scene.remove(m.mesh);
                 droppedMags.splice(i, 1);
             }
         }
         syncNetwork();
         renderer.render(scene, camera);
     }


     window.onload = function() {
         init();
     };
 </script>
</body>
